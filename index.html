<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ঢাকা মনোপলি</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
  :root{--felt:#e7f0e3;--ink:#16213e;--gold:#f4c542;--panel:#1b1b2f;--panel2:#26264a;--shadow:0 8px 26px rgba(0,0,0,.28);}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',system-ui,sans-serif;}
  html,body{min-height:100%;}
  body{background:radial-gradient(circle at 30% 8%,#2a2a4a,#0f0f1c 72%);color:#eee;min-height:100vh;}

  #lobby{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lcard{background:var(--panel);border:1px solid #33335a;border-radius:18px;box-shadow:var(--shadow);width:min(460px,94vw);padding:28px;text-align:center;}
  .flag{font-size:40px;}
  .lcard h1{color:var(--gold);font-size:26px;margin:6px 0 2px;letter-spacing:1px;}
  .lcard .sub{color:#9aa;font-size:13px;margin-bottom:20px;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:#aab;margin-bottom:5px;}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #444;background:#12121f;color:#fff;font-size:15px;}
  input::placeholder{color:#667;}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#111;font-weight:700;font-size:15px;cursor:pointer;transition:.15s;margin-top:4px;}
  .btn:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .btn.sec{background:var(--panel2);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .divider{display:flex;align-items:center;gap:10px;color:#556;margin:16px 0;font-size:12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#33335a;}
  .err{color:#ff7b7b;font-size:13px;min-height:18px;margin-top:8px;}
  .row{display:flex;gap:10px;}

  /* avatar picker */
  .swatches{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 14px;}
  .sw{width:44px;height:44px;border-radius:50%;cursor:pointer;position:relative;border:3px solid transparent;transition:.15s;}
  .sw.on{border-color:#fff;transform:scale(1.08);}
  .sw .eye{position:absolute;top:34%;width:9px;height:9px;background:#fff;border-radius:50%;}
  .sw .eye::after{content:"";position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:5px;height:5px;background:#16151f;border-radius:50%;}
  .sw .eye.l{left:24%;} .sw .eye.r{right:24%;}

  #waiting{display:none;}
  .codebox{background:#12121f;border:2px dashed var(--gold);border-radius:12px;padding:14px;margin-bottom:16px;}
  .codebox .code{font-size:34px;letter-spacing:8px;color:var(--gold);font-weight:700;}
  .codebox small{color:#9aa;}
  .plist{text-align:left;margin:14px 0;display:flex;flex-direction:column;gap:8px;}
  .plist .pl{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:9px;padding:8px 12px;}
  .tag{margin-left:auto;font-size:11px;color:#ffcc55;background:#000;padding:1px 6px;border-radius:6px;}

  #game{display:none;padding:18px;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
  #board{--cell:min(6.4vw,68px);width:calc(var(--cell)*11);height:calc(var(--cell)*11);display:grid;
    grid-template-columns:repeat(11,var(--cell));grid-template-rows:repeat(11,var(--cell));background:var(--felt);
    border:3px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);position:relative;flex:0 0 auto;}
  .cell{border:1px solid rgba(0,0,0,.32);background:#f7f7ef;font-size:calc(var(--cell)*.145);line-height:1.08;padding:2px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#111;}
  .cell .nm{font-weight:600;text-align:center;margin-top:2px;word-break:break-word;}
  .cell .pr{text-align:center;margin-top:auto;font-weight:700;font-size:calc(var(--cell)*.135);}
  .cell .bar{height:calc(var(--cell)*.22);width:100%;border-bottom:1px solid rgba(0,0,0,.45);}
  .corner{align-items:center;justify-content:center;text-align:center;font-weight:700;background:#eef0e6;font-size:calc(var(--cell)*.15);}
  .cell.own{box-shadow:inset 0 0 0 3px var(--own);}
  .cell.here{outline:2px solid var(--gold);outline-offset:-2px;}
  #center{grid-column:2/11;grid-row:2/11;background:var(--felt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;}
  #logo{font-size:calc(var(--cell)*.5);font-weight:700;color:#006a4e;text-align:center;line-height:1.1;text-shadow:1px 1px 0 #fff;}
  #logo b{color:#d62828;}
  .midflag{font-size:calc(var(--cell)*.7);}
  .houses{position:absolute;top:calc(var(--cell)*.22);left:0;width:100%;display:flex;gap:1px;justify-content:center;z-index:2;}
  .house{width:calc(var(--cell)*.1);height:calc(var(--cell)*.1);background:#2ecc71;border:.5px solid #145a32;}
  .house.hotel{background:#e74c3c;width:calc(var(--cell)*.2);}

  /* tokens (avatar faces) */
  #tokenLayer{position:absolute;inset:0;pointer-events:none;z-index:5;}
  .token{position:absolute;left:0;top:0;will-change:transform;}
  .face{width:100%;height:100%;border-radius:50%;background:var(--c);position:relative;
    box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 -4px 6px rgba(0,0,0,.28),inset 0 3px 5px rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;}
  .face .eye{width:26%;height:26%;background:#fff;border-radius:50%;position:absolute;top:28%;}
  .face .eye.l{left:20%;} .face .eye.r{right:20%;}
  .face .eye::after{content:"";position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);width:52%;height:52%;background:#16151f;border-radius:50%;}
  .token.meTok .face{outline:2px solid #fff;}

  /* clean 3D dice */
  #dice{display:flex;gap:14px;}
  .die{width:calc(var(--cell)*.7);height:calc(var(--cell)*.7);background:linear-gradient(145deg,#ffffff,#e6e6ee);
    border-radius:22%;position:relative;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%;gap:6%;
    box-shadow:0 7px 15px rgba(0,0,0,.5),inset 0 -3px 6px rgba(0,0,0,.12),inset 0 3px 6px rgba(255,255,255,.95);}
  .die span{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#40404c,#0c0c12);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.2);align-self:center;justify-self:center;}
  .die span.off{visibility:hidden;}
  @keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-28deg) scale(1.09)}50%{transform:rotate(22deg) scale(.95)}75%{transform:rotate(-12deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
  .die.roll{animation:tumble .5s ease;}

  #panel{width:352px;display:flex;flex-direction:column;gap:14px;flex:0 0 auto;}
  .card{background:var(--panel);border:1px solid #33335a;border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#889;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;}
  .players{display:flex;flex-direction:column;gap:7px;}
  .prow{display:flex;align-items:center;gap:9px;background:var(--panel2);border-radius:9px;padding:7px 10px;transition:.2s;}
  .prow.active{outline:2px solid var(--gold);}
  .prow.bankrupt{opacity:.4;text-decoration:line-through;}
  .miniav{width:24px;height:24px;flex:0 0 auto;}
  .prow .nm{font-weight:600;font-size:14px;}
  .prow .money{margin-left:auto;font-weight:700;color:#40d47e;font-size:14px;}
  .prow .badge{font-size:10px;background:#000;color:#ffcc55;padding:1px 5px;border-radius:5px;}
  .prow .off{width:7px;height:7px;border-radius:50%;background:#e74c3c;}
  .prow .on{width:7px;height:7px;border-radius:50%;background:#40d47e;}
  #status{text-align:center;font-size:14px;color:#cdd;min-height:20px;margin:2px 0;}
  #youare{text-align:center;font-size:12px;color:#889;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .gbtn{flex:1 1 auto;min-width:88px;padding:11px;border:none;border-radius:9px;background:var(--gold);color:#111;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;}
  .gbtn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
  .gbtn.sec{background:var(--panel2);color:#fff;}
  .gbtn.danger{background:#c0392b;color:#fff;}
  .gbtn.warn{background:#3d3d6b;color:#ffd28a;}
  .gbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .props{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;}
  .prop{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer;}
  .prop .chip{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}
  .prop .lv{margin-left:auto;font-size:11px;color:#ffcc55;}
  .empty{color:#667;font-size:12px;text-align:center;padding:6px;}
  #log{height:150px;overflow-y:auto;font-size:12.5px;line-height:1.55;background:#101020;border-radius:9px;padding:9px;display:flex;flex-direction:column-reverse;}
  #log div{padding:2px 0;border-bottom:1px solid #20203a;}
  .good{color:#40d47e;}.rent{color:#ffa94d;}.bad{color:#ff6b6b;}.info{color:#8ab4f8;}.chat{color:#e0c3fc;}
  .chatbox{display:flex;gap:8px;margin-top:8px;}
  .chatbox input{flex:1;padding:8px;}
  .chatbox button{padding:8px 12px;border:none;border-radius:8px;background:var(--panel2);color:#fff;cursor:pointer;}
  .trade{background:var(--panel2);border-radius:9px;padding:9px;font-size:12.5px;margin-bottom:7px;}
  .trade .ta{display:flex;gap:6px;margin-top:6px;}
  .trade .ta button{flex:1;padding:6px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:12px;}
  .acc{background:#40d47e;color:#053;} .dec{background:#c0392b;color:#fff;}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal.show{display:flex;}
  .mbox{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:20px;width:min(460px,94vw);max-height:90vh;overflow-y:auto;}
  .mbox h3{color:var(--gold);text-align:center;margin-bottom:12px;}
  .mcol{display:flex;gap:12px;}
  .mcol>div{flex:1;background:var(--panel2);border-radius:10px;padding:10px;}
  .mcol h4{font-size:12px;color:#aab;margin-bottom:6px;text-align:center;}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;cursor:pointer;}
  .bitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:13px;}
  .bitem .bn{flex:1;}
  .bitem button{border:none;border-radius:7px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:12px;}
  .bitem .add{background:#40d47e;color:#062;}.bitem .rem{background:#ff9d6b;color:#411;}
  .vk{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:13px;}
  .vk .vn{flex:1;} .vk .vc{color:#ffcc55;font-size:12px;} .vk button{border:none;border-radius:6px;padding:6px 10px;background:#c0392b;color:#fff;cursor:pointer;font-weight:700;}
  select{width:100%;padding:9px;border-radius:8px;border:1px solid #444;background:#12121f;color:#fff;font-size:14px;margin-bottom:10px;}
  #cardpop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70;}
  #cardpop.show{display:flex;}
  .cbox{background:#fff;color:#111;border-radius:16px;padding:26px 22px;width:min(340px,90vw);text-align:center;box-shadow:var(--shadow);border-top:10px solid var(--gold);}
  .cbox h3{font-size:20px;margin-bottom:12px;}.cbox p{font-size:16px;line-height:1.6;}
  #conn{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;z-index:80;display:none;}
  /* settings panel */
  #settingsPanel{text-align:left;margin:6px 0 12px;}
  .setgrp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a7fd6;text-align:center;margin:12px 0 6px;}
  .setrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #24243f;}
  .setrow .si{font-size:16px;width:20px;text-align:center;}
  .setrow .sl{flex:1;}
  .setrow .sl b{font-size:13px;font-weight:600;display:block;}
  .setrow .sl small{font-size:11px;color:#778;line-height:1.2;}
  .setrow select{width:auto;padding:5px 8px;margin:0;font-size:13px;}
  .sw-tog{width:42px;height:24px;border-radius:14px;background:#3a3a5a;position:relative;cursor:pointer;flex:0 0 auto;transition:.15s;}
  .sw-tog.on{background:#6c5ce7;}
  .sw-tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
  .sw-tog.on::after{left:21px;}
  .sw-tog.locked{opacity:.5;cursor:not-allowed;}
  /* auction */
  #auctionBox{text-align:center;}
  .aucprop{font-size:20px;font-weight:700;color:var(--gold);margin-bottom:4px;}
  .auchigh{font-size:15px;margin:10px 0;}
  .aucrow{display:flex;gap:8px;margin-top:12px;}
  .aucrow input{flex:1;}
  /* mobile */
  @media (max-width:860px){
    #game{padding:10px;gap:12px;flex-direction:column;align-items:center;}
    #board{--cell:calc((100vw - 20px)/11);}
    #panel{width:100%;max-width:min(96vw,560px);}
    .gbtn{min-width:0;}
    .lcard{padding:20px 16px;}
  }
  @media (max-width:400px){
    .die{width:calc(var(--cell)*.82);height:calc(var(--cell)*.82);}
    #logo{font-size:calc(var(--cell)*.42);}
    .setrow .sl small{display:none;}
  }
</style>
</head>
<body>
<div id="conn"></div>

<div id="lobby">
  <div class="lcard" id="entry">
    <div class="flag">🇧🇩</div>
    <h1>ঢাকা মনোপলি</h1>
    <div class="sub">অনলাইন মাল্টিপ্লেয়ার · সার্ভার লাগে না (পিয়ার-টু-পিয়ার)</div>
    <div class="field"><label>আপনার নাম</label><input id="nameInput" placeholder="যেমনঃ সজল" maxlength="16"></div>
    <label style="font-size:13px;color:#aab;">আপনার অবতার বেছে নিন</label>
    <div class="swatches" id="swatches"></div>
    <button class="btn" id="createBtn">নতুন রুম তৈরি করুন</button>
    <div class="divider">অথবা</div>
    <div class="field"><label>রুম কোড</label>
      <input id="codeInput" placeholder="যেমনঃ ABCDE" maxlength="5" style="text-transform:uppercase;letter-spacing:4px;text-align:center;"></div>
    <button class="btn sec" id="joinBtn">রুমে যোগ দিন</button>
    <div class="err" id="lobbyErr"></div>
  </div>

  <div class="lcard" id="waiting">
    <div class="flag">🇧🇩</div>
    <h1>অপেক্ষা করছি…</h1>
    <div class="sub">বন্ধুদের এই কোড পাঠান</div>
    <div class="codebox"><div class="code" id="roomCode">-----</div><small>এই কোড দিয়ে যে কেউ যোগ দিতে পারবে</small></div>
    <button class="btn sec" id="copyBtn" style="margin-bottom:8px;">🔗 লিংক কপি করুন</button>
    <div class="plist" id="wPlayers"></div>
    <div id="settingsPanel"></div>
    <div class="row" id="hostControls" style="display:none;">
      <button class="btn sec" id="addBotBtn">🤖 বট যোগ</button>
      <button class="btn sec" id="rmBotBtn">বট বাদ</button>
    </div>
    <button class="btn" id="startBtn" style="display:none;">খেলা শুরু করুন</button>
    <div class="sub" id="waitNote" style="margin-top:12px;">হোস্ট খেলা শুরু করার অপেক্ষায়…</div>
    <div class="err" id="waitErr"></div>
  </div>
</div>

<div id="game">
  <div id="board"></div>
  <div id="panel">
    <div class="card"><h2>খেলোয়াড়</h2><div class="players" id="players"></div></div>
    <div class="card">
      <div id="youare"></div><div id="status">…</div>
      <div class="btnrow" style="margin-top:10px;">
        <button class="gbtn" id="rollBtn">🎲 ছক্কা ফেলুন</button>
        <button class="gbtn sec" id="buyBtn" disabled>কিনুন</button>
        <button class="gbtn sec" id="endBtn" disabled>পালা শেষ</button>
      </div>
      <div class="btnrow" style="margin-top:8px;">
        <button class="gbtn sec" id="buildBtn" disabled>🏠 নির্মাণ</button>
        <button class="gbtn warn" id="bailBtn" disabled>জামিন ৳৫০</button>
      </div>
      <div class="btnrow" style="margin-top:8px;">
        <button class="gbtn sec" id="tradeBtn">🤝 ট্রেড</button>
        <button class="gbtn warn" id="votekickBtn">🥾 ভোট-কিক</button>
      </div>
      <div class="btnrow" style="margin-top:8px;">
        <button class="gbtn danger" id="bankruptBtn">দেউলিয়া</button>
        <button class="gbtn sec" id="leaveBtn">🚪 বের হন</button>
      </div>
    </div>
    <div class="card"><h2>আমার সম্পত্তি <span id="propCount" style="color:#40d47e"></span></h2><div class="props" id="myProps"></div></div>
    <div class="card"><h2>ট্রেড অফার</h2><div id="tradeList"></div></div>
    <div class="card"><h2>খেলার বিবরণ</h2><div id="log"></div>
      <div class="chatbox"><input id="chatInput" placeholder="বার্তা লিখুন…" maxlength="120"><button id="chatSend">পাঠান</button></div>
    </div>
  </div>
</div>

<div id="cardpop"><div class="cbox"><h3 id="cardTitle"></h3><p id="cardText"></p></div></div>
<div class="modal" id="buildpop"><div class="mbox"><h3>🏠 বাড়ি / হোটেল</h3><div id="buildList"></div><button class="btn" id="buildClose" style="margin-top:8px;">বন্ধ করুন</button></div></div>
<div class="modal" id="tradepop"><div class="mbox" id="tradeBox"></div></div>
<div class="modal" id="votepop"><div class="mbox"><h3>🥾 ভোট-কিক</h3><div id="voteList"></div><button class="btn" id="voteClose" style="margin-top:8px;">বন্ধ করুন</button></div></div>
<div class="modal" id="auctionpop"><div class="mbox" id="auctionBox"></div></div>

<script>
/* ============================================================
   ঢাকা মনোপলি — serverless P2P (host-authoritative).  Dhaka board,
   avatars, trades, votekick, bankrupt, leave.
   ============================================================ */
const BN=["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
const toBn=n=>String(n).replace(/\d/g,d=>BN[+d]);
const taka=n=>"৳"+toBn(n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- BOARD: Dhaka neighbourhoods, cheap → premium ---- */
const C={brown:"#8d5a2b",lblue:"#a9def9",pink:"#e56399",orange:"#ee964b",red:"#d62828",yellow:"#f6bd60",green:"#2a9d3f",blue:"#1d4e89"};
const BOARD=[
 {n:"শুরু",type:"go"},
 {n:"কামরাঙ্গীরচর",type:"prop",group:"brown",price:60,rent:[2,10,30,90,160,250],house:50},
 {n:"গণ তহবিল",type:"chest"},
 {n:"হাজারীবাগ",type:"prop",group:"brown",price:60,rent:[4,20,60,180,320,450],house:50},
 {n:"আয়কর",type:"tax",amount:200},
 {n:"কমলাপুর রেল স্টেশন",type:"rr",price:200},
 {n:"যাত্রাবাড়ী",type:"prop",group:"lblue",price:100,rent:[6,30,90,270,400,550],house:50},
 {n:"ভাগ্য",type:"chance"},
 {n:"ডেমরা",type:"prop",group:"lblue",price:100,rent:[6,30,90,270,400,550],house:50},

/* ============================================================
   ENGINE (host only)

let room=null;
const idxOf=(r,p)=>r.players.indexOf(p);
const cur=r=>r.players[r.turn];
function logMsg(r,text,cls=""){r.log.push({text,cls});if(r.log.length>60)r.log.shift();}
function ownsGroup(r,p,g){return BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===g).every(x=>r.ownership[x.i]===idxOf(r,p));}
function countType(r,p,t){let c=0;BOARD.forEach((s,i)=>{if(s.type===t&&r.ownership[i]===idxOf(r,p))c++;});return c;}
function credit(r,p,a){p.money+=a;logMsg(r,`${p.name} ৳${a} পেলেন।`,"good");}
function debit(r,p,a,to){p.money-=a;if(to){to.money+=a;logMsg(r,`${p.name} → ${to.name} ভাড়া ৳${a}।`,"rent");}else{if(r.rules.vacationCash)r.pot+=a;logMsg(r,`${p.name} ৳${a} পরিশোধ করলেন।`,"bad");}if(p.money<0)settleDebt(r,p,to);}
function birthday(r,p){let g=0;r.players.forEach(o=>{if(o!==p&&!o.bankrupt){o.money-=10;g+=10;}});p.money+=g;logMsg(r,`${p.name} জন্মদিনে সবার থেকে ৳${g} পেলেন।`,"good");}
function repairs(r,p,ph,pt){let c=0;Object.keys(r.houses).forEach(pos=>{if(r.ownership[pos]===idxOf(r,p)){const n=r.houses[pos];c+=n===5?pt:n*ph;}});if(c>0){logMsg(r,`${p.name} মেরামত খরচ ৳${c}।`,"bad");debit(r,p,c);}}
function releaseProps(r,idx,creditor){Object.keys(r.ownership).forEach(pos=>{if(r.ownership[pos]===idx){if(creditor!=null&&!r.players[creditor].bankrupt)r.ownership[pos]=creditor;else delete r.ownership[pos];r.houses[pos]=0;}});}
function advanceTurn(r){r.canBuy=false;r.lastCard=null;r.landedProp=null;r.doubles=0;let g=0;do{r.turn=(r.turn+1)%r.players.length;g++;}while(r.players[r.turn]&&r.players[r.turn].bankrupt&&g<20);r.phase="awaitRoll";if(cur(r))logMsg(r,`▶ ${cur(r).name}-এর পালা।`,"info");}
function bankruptPlayer(r,idx,creditor,duringRoll){const p=r.players[idx];if(!p||p.bankrupt)return;p.bankrupt=true;logMsg(r,`💀 ${p.name} দেউলিয়া / খেলা থেকে বাদ।`,"bad");releaseProps(r,idx,creditor);p.money=0;
  // drop pending trades & votes involving this player
  r.trades=r.trades.filter(t=>t.from!==idx&&t.to!==idx);delete r.votes[idx];Object.keys(r.votes).forEach(k=>{r.votes[k]=r.votes[k].filter(v=>v!==idx);});
  checkWin(r);if(!duringRoll&&r.phase!=="over"&&r.turn===idx)advanceTurn(r);}
function settleDebt(r,p,cr){const mine=Object.keys(r.houses).filter(pos=>r.ownership[pos]===idxOf(r,p)&&r.houses[pos]>0);for(const pos of mine){while(r.houses[pos]>0&&p.money<0){r.houses[pos]--;p.money+=Math.floor(BOARD[pos].house/2);logMsg(r,`${p.name} ${BOARD[pos].n}-এ বাড়ি বিক্রি করলেন।`,"info");}}if(p.money<0)bankruptPlayer(r,idxOf(r,p),cr?idxOf(r,cr):null,true);}
function moveTo(r,p,pos,go){if(go&&pos<p.pos){p.money+=200;logMsg(r,`${p.name} শুরু পার হয়ে ৳২০০ পেলেন।`,"good");}p.pos=pos;landOn(r,p);}
function advance(r,p,s){const np=(p.pos+s)%40;if(np<p.pos){p.money+=200;logMsg(r,`${p.name} শুরু পার হয়ে ৳২০০ পেলেন।`,"good");}p.pos=np;landOn(r,p);}
function goJail(r,p){p.pos=10;p.jail=true;p.jailTurns=0;r.doubles=0;logMsg(r,`🚔 ${p.name} কারাগারে গেলেন।`,"bad");}
function landOn(r,p){const sq=BOARD[p.pos],owner=r.ownership[p.pos];r.canBuy=false;r.landedProp=null;
  switch(sq.type){
    case"go":logMsg(r,`${p.name} শুরুতে আছেন।`,"info");break;
    case"free":if(r.rules.vacationCash&&r.pot>0){logMsg(r,`🏝️ ${p.name} ফ্রি পার্কিং থেকে ৳${r.pot} পেলেন!`,"good");p.money+=r.pot;r.pot=0;}else logMsg(r,`${p.name} ফ্রি পার্কিং-এ বিশ্রাম নিচ্ছেন।`,"info");break;
    case"jail":logMsg(r,`${p.name} কারাগার পরিদর্শনে।`,"info");break;
    case"tax":logMsg(r,`${p.name} ${sq.n} ৳${sq.amount} দিলেন।`,"bad");debit(r,p,sq.amount);break;
    case"gotojail":goJail(r,p);break;
    case"chance":drawCard(r,p,CHANCE,"ভাগ্য");break;
    case"chest":drawCard(r,p,CHEST,"গণ তহবিল");break;
    case"prop":case"rr":case"util":
      if(owner===undefined){r.landedProp=p.pos;if(p.money>=sq.price){r.canBuy=true;logMsg(r,`${p.name} ${sq.n}-এ নামলেন (৳${sq.price})।`,"info");}else logMsg(r,`${p.name} ${sq.n}-এ নামলেন কিন্তু কেনার টাকা নেই।`,"info");}
      else if(owner===idxOf(r,p))logMsg(r,`${p.name} নিজের সম্পত্তি ${sq.n}-এ আছেন।`,"info");
      else payRent(r,p,sq,r.players[owner]);break;
  }}
function payRent(r,p,sq,owner){if(owner.jail&&r.rules.noPrisonRent){logMsg(r,`${owner.name} কারাগারে — ${sq.n}-এ ভাড়া নেই।`,"info");return;}let rent=0;
  if(sq.type==="prop"){const h=r.houses[p.pos]||0;rent=sq.rent[h];if(h===0&&r.rules.doubleRent&&ownsGroup(r,owner,sq.group))rent*=2;}
  else if(sq.type==="rr")rent=[0,25,50,100,200][countType(r,owner,"rr")];
  else if(sq.type==="util"){const m=countType(r,owner,"util")===2?10:4;rent=m*(r.dice[0]+r.dice[1]);}
  logMsg(r,`${p.name} ${sq.n}-এ ভাড়া ৳${rent} দিতে হবে।`,"rent");debit(r,p,rent,owner);}
function drawCard(r,p,deck,name){const c=deck[Math.floor(Math.random()*deck.length)];r.lastCard={deck:name,text:c.t};logMsg(r,`${name}: ${c.t}`,"info");c.fx(r,p);}

function doRoll(r){const p=cur(r);if(r.phase!=="awaitRoll"||p.bankrupt)return;
  const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);r.dice=[a,b];
  const sum=a+b,dbl=a===b;logMsg(r,`${p.name} ছক্কা ফেলল: ${a} + ${b} = ${sum}${dbl?" (ডাবল!)":""}।`,"info");
  if(p.jail){if(dbl){logMsg(r,`${p.name} ডাবল ফেলে কারাগার থেকে মুক্ত!`,"info");p.jail=false;}
    else{p.jailTurns=(p.jailTurns||0)+1;if(p.jailTurns>=3){logMsg(r,`${p.name} ৩ বার পর ৳৫০ দিয়ে মুক্ত হলেন।`,"info");p.money-=50;p.jail=false;}else{logMsg(r,`${p.name} কারাগারে রয়ে গেলেন।`,"info");r.phase="awaitEnd";return;}}}
  r.doubles=dbl?r.doubles+1:0;
  if(r.doubles===3){logMsg(r,`${p.name} পরপর ৩ ডাবল — কারাগারে!`,"bad");goJail(r,p);r.phase="awaitEnd";return;}
  advance(r,p,sum);
  if(p.bankrupt)advanceTurn(r);else r.phase="awaitEnd";}
function doBuy(r){const p=cur(r);if(r.phase!=="awaitEnd"||!r.canBuy)return;const sq=BOARD[p.pos];if(r.ownership[p.pos]!==undefined||p.money<sq.price)return;p.money-=sq.price;r.ownership[p.pos]=idxOf(r,p);r.canBuy=false;r.landedProp=null;logMsg(r,`🏠 ${p.name} ${sq.n} কিনলেন (৳${sq.price})।`,"good");}
function groupIdx(g){return BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===g).map(x=>x.i);}
function doBuild(r,pos){const p=cur(r);if(p.bankrupt)return;const sq=BOARD[pos];if(!sq||sq.type!=="prop")return;if(r.ownership[pos]!==idxOf(r,p))return;if(!ownsGroup(r,p,sq.group))return;if((r.houses[pos]||0)>=5)return;if(p.money<sq.house)return;
  if(r.rules.evenBuild){const min=Math.min(...groupIdx(sq.group).map(i=>r.houses[i]||0));if((r.houses[pos]||0)>min)return;}
  p.money-=sq.house;r.houses[pos]=(r.houses[pos]||0)+1;const lvl=r.houses[pos]===5?"হোটেল":`${r.houses[pos]} বাড়ি`;logMsg(r,`${p.name} ${sq.n}-এ নির্মাণ করলেন (${lvl})।`,"good");}
function doSell(r,pos){const p=cur(r);const sq=BOARD[pos];if(!sq||sq.type!=="prop")return;if(r.ownership[pos]!==idxOf(r,p))return;if((r.houses[pos]||0)<=0)return;
  if(r.rules.evenBuild){const max=Math.max(...groupIdx(sq.group).map(i=>r.houses[i]||0));if((r.houses[pos]||0)<max)return;}
  r.houses[pos]--;p.money+=Math.floor(sq.house/2);logMsg(r,`${p.name} ${sq.n}-এ বাড়ি বিক্রি করলেন।`,"info");}
function doBail(r){const p=cur(r);if(!p.jail||r.phase!=="awaitRoll"||p.money<50)return;p.money-=50;p.jail=false;p.jailTurns=0;logMsg(r,`${p.name} ৳৫০ জামিন দিয়ে মুক্ত হলেন।`,"info");}
function finishTurn(r){const p=cur(r);const dbl=r.dice[0]===r.dice[1];if(dbl&&!p.jail&&!p.bankrupt&&r.doubles>0&&r.doubles<3){r.canBuy=false;r.lastCard=null;r.landedProp=null;r.phase="awaitRoll";logMsg(r,`${p.name} ডাবল ফেলায় আবার চাল দেবেন।`,"info");return;}advanceTurn(r);}
function doEnd(r){const p=cur(r);if(r.phase!=="awaitEnd")return;if(r.rules.auction&&r.landedProp!=null&&!p.bankrupt){startAuction(r,r.landedProp);return;}finishTurn(r);}
/* ---- auction ---- */
function startAuction(r,pos){r.auction={pos,high:0,highBy:-1,passed:[]};r.phase="auction";r.canBuy=false;r.landedProp=null;logMsg(r,`🔨 নিলাম শুরু: ${BOARD[pos].n} (ভিত্তি ৳${BOARD[pos].price})।`,"info");autoBotAuction(r);}
function autoBotAuction(r){if(!r.auction)return;r.players.forEach((p,i)=>{if(p.isBot&&!p.bankrupt&&!r.auction.passed.includes(i))r.auction.passed.push(i);});checkAuction(r);}
function auctionBid(r,idx,amount){const a=r.auction;if(!a)return;const p=r.players[idx];if(!p||p.bankrupt||a.passed.includes(idx))return;amount=Math.floor(+amount||0);if(amount<=a.high||amount>p.money)return;a.high=amount;a.highBy=idx;logMsg(r,`🔨 ${p.name} ৳${amount} বিড করলেন।`,"info");checkAuction(r);}
function auctionPass(r,idx){const a=r.auction;if(!a)return;if(!a.passed.includes(idx))a.passed.push(idx);logMsg(r,`🔨 ${r.players[idx].name} পাস করলেন।`,"info");checkAuction(r);}
function checkAuction(r){const a=r.auction;if(!a)return;const active=r.players.map((p,i)=>i).filter(i=>!r.players[i].bankrupt);const remaining=active.filter(i=>!a.passed.includes(i));
  if(a.high>0){if(remaining.every(i=>i===a.highBy)){const w=r.players[a.highBy];w.money-=a.high;r.ownership[a.pos]=a.highBy;logMsg(r,`🔨 ${w.name} নিলামে ${BOARD[a.pos].n} কিনলেন (৳${a.high})।`,"good");endAuction(r);}}
  else if(remaining.length===0){logMsg(r,`🔨 কেউ বিড করেনি — ${BOARD[a.pos].n} অবিক্রীত রইলো।`,"info");endAuction(r);}}
function endAuction(r){r.auction=null;finishTurn(r);}
function checkWin(r){const alive=r.players.filter(p=>!p.bankrupt);if(r.started&&alive.length<=1){r.winner=alive[0]?alive[0].name:"কেউ না";r.phase="over";logMsg(r,`🏆 ${r.winner} জিতেছেন!`,"good");}}

/* ---- trades ---- */
function createTrade(r,from,to,give,want){if(from===to)return;const f=r.players[from],t=r.players[to];if(!f||!t||f.bankrupt||t.bankrupt)return;
  // sanity: can't include built props
  const bad=[...give.props,...want.props].some(pos=>r.houses[pos]);if(bad)return;
  r.trades.push({id:r.tradeSeq++,from,to,give,want});logMsg(r,`🤝 ${f.name} → ${t.name}-কে ট্রেড অফার পাঠালেন।`,"info");}
function respondTrade(r,id,by,accept){const i=r.trades.findIndex(t=>t.id===id);if(i<0)return;const t=r.trades[i];if(t.to!==by)return;
  if(!accept){r.trades.splice(i,1);logMsg(r,`${r.players[by].name} ট্রেড প্রত্যাখ্যান করলেন।`,"info");return;}
  const from=r.players[t.from],to=r.players[t.to];
  const ok=from.money>=t.give.money&&to.money>=t.want.money&&t.give.props.every(p=>r.ownership[p]===t.from)&&t.want.props.every(p=>r.ownership[p]===t.to)&&![...t.give.props,...t.want.props].some(p=>r.houses[p]);
  if(!ok){r.trades.splice(i,1);logMsg(r,`ট্রেড বাতিল (শর্ত পূরণ হয়নি)।`,"bad");return;}
  from.money-=t.give.money;to.money+=t.give.money;to.money-=t.want.money;from.money+=t.want.money;
  t.give.props.forEach(p=>r.ownership[p]=t.to);t.want.props.forEach(p=>r.ownership[p]=t.from);
  r.trades.splice(i,1);logMsg(r,`✅ ${from.name} ও ${to.name}-এর ট্রেড সম্পন্ন হলো।`,"good");}
function cancelTrade(r,id,by){const i=r.trades.findIndex(t=>t.id===id);if(i<0)return;if(r.trades[i].from!==by)return;r.trades.splice(i,1);}
/* ---- votekick ---- */
function votekick(r,voter,target){if(voter===target)return;const p=r.players[target];if(!p||p.bankrupt)return;r.votes[target]=r.votes[target]||[];if(!r.votes[target].includes(voter))r.votes[target].push(voter);
  const eligible=r.players.filter((x,i)=>!x.bankrupt&&!x.isBot&&i!==target).length;const need=Math.floor(eligible/2)+1;
  logMsg(r,`🥾 ${r.players[voter].name} → ${p.name}-কে কিক ভোট (${r.votes[target].length}/${need})।`,"info");
  if(r.votes[target].length>=need){logMsg(r,`🥾 ভোটে ${p.name} বাদ পড়লেন।`,"bad");bankruptPlayer(r,target,null,false);}}

/* ---- bots ---- */
function scheduleBot(r,ms=950){if(r.botTimer)clearTimeout(r.botTimer);r.botTimer=setTimeout(()=>botStep(r),ms);}
function botStep(r){r.botTimer=null;if(!r.started||r.phase==="over")return;const p=cur(r);if(!p||!p.isBot||p.bankrupt)return;
  if(r.phase==="awaitRoll"){if(p.jail&&p.money>=80&&Math.random()<0.5)doBail(r);doRoll(r);hostBroadcast();maybeBot(r);}
  else if(r.phase==="awaitEnd"){if(r.canBuy){const sq=BOARD[p.pos];if(p.money>=sq.price+60&&Math.random()<0.85)doBuy(r);}botBuild(r,p);doEnd(r);hostBroadcast();maybeBot(r);}}
function botBuild(r,p){BOARD.forEach((s,i)=>{if(s.type==="prop"&&r.ownership[i]===idxOf(r,p)&&ownsGroup(r,p,s.group)&&(r.houses[i]||0)<5){if(p.money>s.house+200&&Math.random()<0.55)doBuild(r,i);}});}
function maybeBot(r){if(!r.started||r.phase==="over")return;const p=cur(r);if(p&&p.isBot&&!p.bankrupt)scheduleBot(r);}

function publicState(r){return{type:"state",code:r.code,started:r.started,phase:r.phase,turn:r.turn,dice:r.dice,canBuy:r.canBuy,winner:r.winner,lastCard:r.lastCard,log:r.log.slice(-40),
  players:r.players.map(p=>({name:p.name,color:p.color,money:p.money,pos:p.pos,jail:p.jail,bankrupt:p.bankrupt,isBot:p.isBot,connected:p.connected})),
  ownership:r.ownership,houses:r.houses,rules:r.rules,pot:r.pot,auction:r.auction,
  trades:r.trades.map(t=>({id:t.id,from:t.from,to:t.to,give:t.give,want:t.want})),
  votes:Object.fromEntries(Object.entries(r.votes).map(([k,v])=>[k,v.length]))};}

function randCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
const DEFAULT_RULES={maxPlayers:6,startCash:1500,allowBots:true,doubleRent:true,vacationCash:false,auction:true,evenBuild:true,noPrisonRent:true};
function newRoom(code){return{code,players:[],ownership:{},houses:{},turn:0,dice:[1,1],doubles:0,started:false,winner:null,phase:"lobby",canBuy:false,lastCard:null,log:[],hostClient:null,botTimer:null,trades:[],tradeSeq:1,votes:{},rules:{...DEFAULT_RULES},pot:0,auction:null,landedProp:null};}
function freeColor(r,pref){const used=r.players.map(p=>p.color);if(pref&&!used.includes(pref))return pref;return PALETTE.find(c=>!used.includes(c))||PALETTE[r.players.length%PALETTE.length];}
function mkPlayer(r,cid,name,isBot,color){return{clientId:cid,name,color:freeColor(r,color),money:(r.rules?r.rules.startCash:1500),pos:0,jail:false,jailTurns:0,bankrupt:false,isBot,connected:true};}

/* ---- HOST ---- */
function hostCreate(){NET.isHost=true;IS_HOST=true;NET.name=nameVal();const code=randCode();connBanner("সংযোগ তৈরি হচ্ছে…");
  NET.peer=new Peer(PEER_PREFIX+code,PEER_OPTS);
  NET.peer.on("open",()=>{NET.code=code;connBanner(null);room=newRoom(code);room.hostClient=clientId;
    room.players.push(mkPlayer(room,clientId,NET.name,false,NET.color));logMsg(room,`${NET.name} রুম তৈরি করলেন।`,"info");YOU=0;showWaiting();hostBroadcast();});
  NET.peer.on("connection",conn=>hostOnConn(conn));
  NET.peer.on("error",e=>{if(String(e).includes("is taken")){NET.peer.destroy();return hostCreate();}setErr("lobbyErr","সংযোগ ত্রুটি: "+e.type);connBanner(null);});}
function hostOnConn(conn){NET.conns.push(conn);conn.on("data",msg=>hostOnData(conn,msg));conn.on("close",()=>{const p=room&&room.players[conn.playerIndex];if(p)p.connected=false;hostBroadcast();});conn.on("error",()=>{});}
function hostOnData(conn,msg){if(!room)return;
  if(msg.type==="join"){const ex=room.players.findIndex(p=>p.clientId===msg.clientId);
    if(ex>=0){room.players[ex].connected=true;conn.playerIndex=ex;conn.clientId=msg.clientId;conn.send({type:"welcome",you:ex});hostBroadcast();maybeBot(room);return;}
    if(room.started){conn.send({type:"error",message:"খেলা ইতিমধ্যে শুরু হয়েছে।"});return;}
    if(room.players.length>=room.rules.maxPlayers){conn.send({type:"error",message:"রুম পূর্ণ।"});return;}
    const idx=room.players.length;room.players.push(mkPlayer(room,msg.clientId,(msg.name||"খেলোয়াড়").slice(0,16),false,msg.color));
    conn.playerIndex=idx;conn.clientId=msg.clientId;logMsg(room,`${room.players[idx].name} রুমে যোগ দিলেন।`,"info");conn.send({type:"welcome",you:idx});hostBroadcast();return;}
  hostHandle(msg.clientId||conn.clientId,msg);}
function hostHandle(cid,msg){if(!room)return;const pidx=room.players.findIndex(p=>p.clientId===cid);
  const turnOk=()=>room.started&&room.phase!=="over"&&pidx===room.turn&&!room.players[room.turn].bankrupt;
  switch(msg.type){
    case"start":if(cid===room.hostClient&&!room.started&&room.players.length>=2){room.players.forEach(p=>p.money=room.rules.startCash);room.started=true;room.phase="awaitRoll";room.turn=0;logMsg(room,`🎲 খেলা শুরু! ${cur(room).name}-এর পালা।`,"good");hostBroadcast();maybeBot(room);}break;
    case"addBot":if(cid===room.hostClient&&!room.started&&room.rules.allowBots&&room.players.length<room.rules.maxPlayers){const bi=room.players.filter(p=>p.isBot).length;room.players.push(mkPlayer(room,"bot-"+Math.random().toString(36).slice(2),BOT_NAMES[bi]||("রোবট-"+(bi+1)),true));logMsg(room,`একটি বট যোগ হলো।`,"info");hostBroadcast();}break;
    case"removeBot":if(cid===room.hostClient&&!room.started){for(let i=room.players.length-1;i>=0;i--){if(room.players[i].isBot){room.players.splice(i,1);break;}}hostBroadcast();}break;
    case"setRule":if(cid===room.hostClient&&!room.started&&room.rules.hasOwnProperty(msg.key)){const k=msg.key,v=msg.value;if(k==="maxPlayers")room.rules.maxPlayers=Math.max(Math.max(2,room.players.length),Math.min(6,+v||6));else if(k==="startCash")room.rules.startCash=[1000,1500,2000,2500].includes(+v)?+v:1500;else room.rules[k]=!!v;if(k==="startCash")room.players.forEach(p=>{if(!room.started)p.money=room.rules.startCash;});hostBroadcast();}break;
    case"bid":if(pidx>=0&&room.phase==="auction"){auctionBid(room,pidx,msg.amount);hostBroadcast();maybeBot(room);}break;
    case"pass":if(pidx>=0&&room.phase==="auction"){auctionPass(room,pidx);hostBroadcast();maybeBot(room);}break;
    case"roll":if(turnOk()){doRoll(room);hostBroadcast();maybeBot(room);}break;
    case"buy":if(turnOk()){doBuy(room);hostBroadcast();}break;
    case"build":if(turnOk()){doBuild(room,msg.pos);hostBroadcast();}break;
    case"sell":if(turnOk()){doSell(room,msg.pos);hostBroadcast();}break;
    case"bail":if(turnOk()){doBail(room);hostBroadcast();}break;
    case"end":if(turnOk()){doEnd(room);hostBroadcast();maybeBot(room);}break;
    case"trade":if(pidx>=0){createTrade(room,pidx,msg.to,msg.give,msg.want);hostBroadcast();}break;
    case"tradeRespond":if(pidx>=0){respondTrade(room,msg.id,pidx,msg.accept);hostBroadcast();maybeBot(room);}break;
    case"tradeCancel":if(pidx>=0){cancelTrade(room,msg.id,pidx);hostBroadcast();}break;
    case"votekick":if(pidx>=0){votekick(room,pidx,msg.target);hostBroadcast();maybeBot(room);}break;
    case"bankrupt":if(pidx>=0){bankruptPlayer(room,pidx,null,false);hostBroadcast();maybeBot(room);}break;
    case"leave":if(pidx>=0){const p=room.players[pidx];p.connected=false;if(room.started)bankruptPlayer(room,pidx,null,false);else{room.players.splice(pidx,1);room.players.forEach((x,i)=>x._i=i);}logMsg(room,`${p.name} খেলা ছেড়ে গেলেন।`,"info");hostBroadcast();maybeBot(room);}break;
    case"chat":{const nm=room.players[pidx]?.name||"?";logMsg(room,`💬 ${nm}: ${String(msg.text||"").slice(0,120)}`,"chat");hostBroadcast();}break;
  }}
function hostBroadcast(){const base=publicState(room);S={...base,you:0};render();NET.conns.forEach(c=>{if(c.open)c.send({...base,you:typeof c.playerIndex==="number"?c.playerIndex:-1});});}

function guestJoin(code){NET.isHost=false;IS_HOST=false;NET.name=nameVal();NET.code=code;connBanner("হোস্টের সাথে সংযোগ হচ্ছে…");
  NET.peer=new Peer(PEER_OPTS);
  NET.peer.on("open",()=>{const conn=NET.peer.connect(PEER_PREFIX+code,{reliable:true});NET.hostConn=conn;let opened=false;
    conn.on("open",()=>{opened=true;connBanner(null);conn.send({type:"join",name:NET.name,clientId,color:NET.color});showWaiting();});
    conn.on("data",msg=>guestOnData(msg));
    conn.on("close",()=>{connBanner("সংযোগ বিচ্ছিন্ন — পুনরায় চেষ্টা…");setTimeout(()=>guestJoin(code),1500);});
    conn.on("error",()=>{});
    setTimeout(()=>{if(!opened){setErr("lobbyErr","রুম খুঁজে পাওয়া যায়নি বা হোস্ট অফলাইন।");connBanner(null);try{NET.peer.destroy();}catch(e){}}},9000);});
  NET.peer.on("error",e=>{if(e.type==="peer-unavailable")setErr("lobbyErr","এই কোডের কোনো রুম নেই (হোস্ট অনলাইন আছে তো?)।");else setErr("lobbyErr","সংযোগ ত্রুটি: "+e.type);connBanner(null);});}
function guestOnData(msg){if(msg.type==="welcome"){YOU=msg.you;showWaiting();return;}if(msg.type==="error"){setErr(entryVisible()?"lobbyErr":"waitErr",msg.message);return;}if(msg.type==="state"){S=msg;if(typeof msg.you==="number")YOU=msg.you;render();}}

function act(msg){if(NET.isHost)hostHandle(clientId,{...msg,clientId});else if(NET.hostConn&&NET.hostConn.open)NET.hostConn.send({...msg,clientId});}

function buildBoardDOM(){const bd=document.getElementById("board");bd.innerHTML="";cellEls.length=0;tokenEls={};renderedPos={};animSeq={};
  const center=document.createElement("div");center.id="center";center.innerHTML=`<div class="midflag">🇧🇩</div><div id="logo">ঢাকা<br><b>মনোপলি</b></div><div id="dice"><div class="die"></div><div class="die"></div></div>`;bd.appendChild(center);
  BOARD.forEach((sq,i)=>{const el=document.createElement("div");const gp=gridPos(i);el.style.gridRow=gp.r;el.style.gridColumn=gp.c;el.className="cell"+(i%10===0?" corner":"");el.innerHTML=cellHTML(sq);bd.appendChild(el);cellEls[i]=el;});
  tokenLayer=document.createElement("div");tokenLayer.id="tokenLayer";bd.appendChild(tokenLayer);drawDice();}
function cellHTML(sq){
  if(sq.type==="prop")return `<div class="bar" style="background:${C[sq.group]}"></div><div class="nm">${sq.n}</div><div class="pr">${taka(sq.price)}</div>`;
  if(sq.type==="rr")return `<div class="nm">🚉<br>${sq.n}</div><div class="pr">${taka(200)}</div>`;
  if(sq.type==="util")return `<div class="nm">${sq.n.includes("বিদ্যুৎ")?"💡":"🚰"}<br>${sq.n}</div><div class="pr">${taka(150)}</div>`;
  if(sq.type==="tax")return `<div class="nm">💰<br>${sq.n}</div><div class="pr">${taka(sq.amount)}</div>`;
  if(sq.type==="chance")return `<div class="nm" style="margin-top:20%;font-size:1.6em">❓</div><div class="nm">${sq.n}</div>`;
  if(sq.type==="chest")return `<div class="nm" style="margin-top:20%;font-size:1.6em">📦</div><div class="nm">${sq.n}</div>`;
  if(sq.type==="go")return `<div style="text-align:center">⬅️<br>শুরু<br>${taka(200)}</div>`;
  if(sq.type==="jail")return `<div style="text-align:center">🔒<br>কারাগার</div>`;
  if(sq.type==="free")return `<div style="text-align:center">🅿️<br>ফ্রি<br>পার্কিং</div>`;
  if(sq.type==="gotojail")return `<div style="text-align:center">🚔<br>জেলে<br>যাও</div>`;
  return sq.n;}

function boardCell(){return document.getElementById("board").getBoundingClientRect().width/11;}
function subOffset(i,cs){const pts=[[-.16,-.16],[.16,-.16],[-.16,.16],[.16,.16],[0,0],[0,.26]];const p=pts[i%pts.length];return{x:p[0]*cs,y:p[1]*cs};}
function placeToken(el,pos,sub){const gp=gridPos(pos),cs=boardCell(),sz=cs*0.5;el.style.width=el.style.height=sz+"px";const off=subOffset(sub,cs);
  const x=(gp.c-1)*cs+cs/2-sz/2+off.x,y=(gp.r-1)*cs+cs/2-sz/2+off.y;el.style.transform=`translate(${x}px,${y}px)`;}
async function moveToken(idx,from,to,sub){const el=tokenEls[idx];if(!el)return;const d=(to-from+40)%40;const seq=++animSeq[idx];el.style.transition="transform .14s ease-in-out";
  if(d===0||d>18){placeToken(el,to,sub);return;}for(let s=1;s<=d;s++){if(animSeq[idx]!==seq)return;placeToken(el,(from+s)%40,sub);await sleep(150);}}
function makeToken(color){const el=document.createElement("div");el.className="token";el.innerHTML=`<div class="face" style="--c:${color}"><span class="eye l"></span><span class="eye r"></span></div>`;return el;}
function renderTokens(){if(!tokenLayer)return;
  S.players.forEach((p,i)=>{let el=tokenEls[i];if(!el){el=makeToken(p.color);tokenLayer.appendChild(el);tokenEls[i]=el;animSeq[i]=0;}
    el.style.display=p.bankrupt?"none":"block";el.classList.toggle("meTok",i===YOU);el.querySelector(".face").style.setProperty("--c",p.color);
    const to=p.pos;if(renderedPos[i]===undefined){placeToken(el,to,i);renderedPos[i]=to;}else if(renderedPos[i]!==to){const from=renderedPos[i];renderedPos[i]=to;moveToken(i,from,to,i);}});}
function repositionTokens(){S.players.forEach((p,i)=>{if(tokenEls[i]&&renderedPos[i]!==undefined)placeToken(tokenEls[i],renderedPos[i],i);});}

function renderGame(){
  const pl=document.getElementById("players");pl.innerHTML="";
  S.players.forEach((p,i)=>{const d=document.createElement("div");d.className="prow"+(i===S.turn?" active":"")+(p.bankrupt?" bankrupt":"");
    d.innerHTML=`${miniAv(p.color)}<div class="nm">${p.name}${i===YOU?" (আপনি)":""}</div>${p.jail?'<span class="badge">জেল</span>':""}${p.isBot?'<span class="badge">বট</span>':`<span class="${p.connected?"on":"off"}"></span>`}<div class="money">${taka(p.money)}</div>`;pl.appendChild(d);});
  cellEls.forEach((el,i)=>{el.classList.remove("own","here");el.style.removeProperty("--own");const o=S.ownership[i];if(o!==undefined){el.classList.add("own");el.style.setProperty("--own",S.players[o].color);}});
  if(S.players[S.turn])cellEls[S.players[S.turn].pos]?.classList.add("here");
  document.querySelectorAll(".houses").forEach(e=>e.remove());
  Object.entries(S.houses).forEach(([pos,n])=>{if(!n)return;const h=document.createElement("div");h.className="houses";if(n===5){const e=document.createElement("div");e.className="house hotel";h.appendChild(e);}else for(let k=0;k<n;k++){const e=document.createElement("div");e.className="house";h.appendChild(e);}cellEls[pos].appendChild(h);});
  renderTokens();
  const dkey=S.dice.join("-")+"/"+S.turn+"/"+S.phase;if(dkey!==lastDice){drawDice(true);lastDice=dkey;}
  const logEl=document.getElementById("log");logEl.innerHTML="";S.log.slice().reverse().forEach(l=>{const d=document.createElement("div");d.className=l.cls;d.textContent=l.text;logEl.appendChild(d);});
  renderMyProps();renderTrades();renderAuction();
  const me=S.turn===YOU,p=S.players[S.turn];
  document.getElementById("youare").textContent=S.winner?"":(me?"আপনার পালা!":`${p.name}-এর পালা…`);
  const iAmOut=YOU<0||!S.players[YOU]||S.players[YOU].bankrupt;
  if(S.winner){document.getElementById("status").innerHTML=`🏆 <b>${S.winner}</b> জিতেছেন!`;["rollBtn","buyBtn","endBtn","buildBtn","bailBtn","tradeBtn","votekickBtn","bankruptBtn"].forEach(id=>document.getElementById(id).disabled=true);}
  else{const sq=BOARD[p.pos];let st="";
    if(S.phase==="auction")st="🔨 নিলাম চলছে…";
    else if(S.phase==="awaitRoll")st=me?(p.jail?"কারাগারে — ছক্কা ফেলুন বা জামিন দিন।":"ছক্কা ফেলুন।"):`${p.name}-এর পালা…`;
    else if(S.phase==="awaitEnd")st=me?(S.canBuy?`${sq.n} কিনবেন ${taka(sq.price)}?`:"পালা শেষ করুন বা নির্মাণ করুন।"):`${p.name}-এর পালা…`;
    document.getElementById("status").textContent=st;
    document.getElementById("rollBtn").disabled=!(me&&S.phase==="awaitRoll");
    document.getElementById("buyBtn").disabled=!(me&&S.phase==="awaitEnd"&&S.canBuy);
    document.getElementById("endBtn").disabled=!(me&&S.phase==="awaitEnd");
    document.getElementById("bailBtn").disabled=!(me&&S.phase==="awaitRoll"&&p.jail&&p.money>=50);
    document.getElementById("buildBtn").disabled=!(me&&(S.phase==="awaitEnd"||S.phase==="awaitRoll")&&hasBuildable());
    document.getElementById("tradeBtn").disabled=iAmOut;
    document.getElementById("votekickBtn").disabled=iAmOut;
    document.getElementById("bankruptBtn").disabled=iAmOut;
  }
  if(S.lastCard&&JSON.stringify(S.lastCard)!==lastCardShown){lastCardShown=JSON.stringify(S.lastCard);showCard(S.lastCard.deck,S.lastCard.text);}
  if(!S.lastCard)lastCardShown=null;
  if(document.getElementById("buildpop").classList.contains("show"))openBuild();
  if(document.getElementById("votepop").classList.contains("show"))openVote();
}
function drawDice(animate){const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  document.querySelectorAll("#dice .die").forEach((die,k)=>{const v=(S&&S.dice[k])||1;die.innerHTML="";for(let j=0;j<9;j++){const s=document.createElement("span");if(!P[v].includes(j))s.className="off";die.appendChild(s);}if(animate){die.classList.remove("roll");void die.offsetWidth;die.classList.add("roll");}});}
function showCard(title,text){document.getElementById("cardTitle").textContent=title;document.getElementById("cardText").textContent=text;const pop=document.getElementById("cardpop");pop.classList.add("show");setTimeout(()=>pop.classList.remove("show"),2600);}

/* my properties */
function myPropsList(who){const arr=[];BOARD.forEach((s,i)=>{if((s.type==="prop"||s.type==="rr"||s.type==="util")&&S.ownership[i]===who)arr.push(i);});return arr;}
function renderMyProps(){const box=document.getElementById("myProps");const mine=myPropsList(YOU);document.getElementById("propCount").textContent=mine.length?`(${toBn(mine.length)})`:"";box.innerHTML="";
  if(!mine.length){box.innerHTML='<div class="empty">এখনো কোনো সম্পত্তি নেই।</div>';return;}
  mine.forEach(i=>{const s=BOARD[i];const n=S.houses[i]||0;const chip=s.group?C[s.group]:(s.type==="rr"?"#333":"#888");
    const lv=s.type==="prop"?(n===5?"হোটেল":n?toBn(n)+"🏠":""):(s.type==="rr"?"🚉":"🔌");
    const row=document.createElement("div");row.className="prop";row.innerHTML=`<span class="chip" style="background:${chip}"></span><span>${s.n}</span><span class="lv">${lv}</span>`;
    row.onclick=()=>{if(s.type==="prop")openBuild();};box.appendChild(row);});}

/* build */
function myFullSets(){const g={};BOARD.forEach((s,i)=>{if(s.type==="prop"&&S.ownership[i]===YOU)(g[s.group]=g[s.group]||[]).push(i);});const cells=[];Object.entries(g).forEach(([grp,arr])=>{const all=BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===grp);if(all.every(x=>S.ownership[x.i]===YOU))cells.push(...arr);});return cells;}
function hasBuildable(){return myFullSets().length>0;}
function openBuild(){const list=document.getElementById("buildList");const cells=myFullSets();list.innerHTML="";
  if(!cells.length)list.innerHTML="<p style='text-align:center;color:#889'>নির্মাণের জন্য একটি সম্পূর্ণ রঙের সেট দরকার।</p>";
  cells.forEach(i=>{const n=S.houses[i]||0;const label=n===5?"হোটেল (সর্বোচ্চ)":toBn(n)+" বাড়ি";const row=document.createElement("div");row.className="bitem";
    row.innerHTML=`<span class="bn">${BOARD[i].n} · ${label}</span><button class="rem" ${n<=0?"disabled style='opacity:.4'":""}>−</button><button class="add" ${n>=5?"disabled style='opacity:.4'":""}>+ ${taka(BOARD[i].house)}</button>`;
    row.querySelector(".add").onclick=()=>act({type:"build",pos:i});row.querySelector(".rem").onclick=()=>act({type:"sell",pos:i});list.appendChild(row);});
  document.getElementById("buildpop").classList.add("show");}

/* trades */
function renderTrades(){const box=document.getElementById("tradeList");box.innerHTML="";const mine=(S.trades||[]).filter(t=>t.to===YOU||t.from===YOU);
  if(!mine.length){box.innerHTML='<div class="empty">কোনো ট্রেড অফার নেই।</div>';return;}
  mine.forEach(t=>{const from=S.players[t.from],to=S.players[t.to];const d=document.createElement("div");d.className="trade";
    const gv=[...t.give.props.map(p=>BOARD[p].n),t.give.money?taka(t.give.money):null].filter(Boolean).join(", ")||"কিছু না";
    const wt=[...t.want.props.map(p=>BOARD[p].n),t.want.money?taka(t.want.money):null].filter(Boolean).join(", ")||"কিছু না";
    d.innerHTML=`<b>${from.name}</b> দেবে: ${gv}<br><b>${to.name}</b> দেবে: ${wt}`;
    if(t.to===YOU){const a=document.createElement("div");a.className="ta";a.innerHTML=`<button class="acc">গ্রহণ</button><button class="dec">প্রত্যাখ্যান</button>`;
      a.querySelector(".acc").onclick=()=>act({type:"tradeRespond",id:t.id,accept:true});a.querySelector(".dec").onclick=()=>act({type:"tradeRespond",id:t.id,accept:false});d.appendChild(a);}
    else{const a=document.createElement("div");a.className="ta";a.innerHTML=`<button class="dec">বাতিল</button>`;a.querySelector(".dec").onclick=()=>act({type:"tradeCancel",id:t.id});d.appendChild(a);}
    box.appendChild(d);});}
function openTrade(){const others=S.players.map((p,i)=>({p,i})).filter(x=>x.i!==YOU&&!x.p.bankrupt);if(!others.length){alert("ট্রেড করার মতো কেউ নেই।");return;}
  const box=document.getElementById("tradeBox");
  const opts=others.map(x=>`<option value="${x.i}">${x.p.name}</option>`).join("");
  box.innerHTML=`<h3>🤝 ট্রেড তৈরি করুন</h3>
    <label style="font-size:12px;color:#aab">কার সাথে?</label><select id="tradeTo">${opts}</select>
    <div class="mcol">
      <div><h4>আপনি দেবেন</h4><div id="giveProps"></div><label style="font-size:11px;color:#aab">টাকা</label><input id="giveMoney" type="number" min="0" value="0"></div>
      <div><h4>আপনি পাবেন</h4><div id="wantProps"></div><label style="font-size:11px;color:#aab">টাকা</label><input id="wantMoney" type="number" min="0" value="0"></div>
    </div>
    <div class="btnrow" style="margin-top:14px"><button class="gbtn" id="tradeSend">অফার পাঠান</button><button class="gbtn sec" id="tradeCancelBtn">বাতিল</button></div>`;
  const fillProps=()=>{const to=+document.getElementById("tradeTo").value;
    const gp=document.getElementById("giveProps");gp.innerHTML="";myPropsList(YOU).filter(i=>!S.houses[i]).forEach(i=>{gp.innerHTML+=`<label class="chk"><input type="checkbox" data-give="${i}"> ${BOARD[i].n}</label>`;});
    if(!gp.innerHTML)gp.innerHTML='<div class="empty">নেই</div>';
    const wp=document.getElementById("wantProps");wp.innerHTML="";myPropsList(to).filter(i=>!S.houses[i]).forEach(i=>{wp.innerHTML+=`<label class="chk"><input type="checkbox" data-want="${i}"> ${BOARD[i].n}</label>`;});
    if(!wp.innerHTML)wp.innerHTML='<div class="empty">নেই</div>';};
  fillProps();document.getElementById("tradeTo").onchange=fillProps;
  document.getElementById("tradeCancelBtn").onclick=()=>document.getElementById("tradepop").classList.remove("show");
  document.getElementById("tradeSend").onclick=()=>{const to=+document.getElementById("tradeTo").value;
    const give={props:[...document.querySelectorAll("[data-give]:checked")].map(x=>+x.dataset.give),money:Math.max(0,+document.getElementById("giveMoney").value||0)};
    const want={props:[...document.querySelectorAll("[data-want]:checked")].map(x=>+x.dataset.want),money:Math.max(0,+document.getElementById("wantMoney").value||0)};
    if(!give.props.length&&!give.money&&!want.props.length&&!want.money){alert("অন্তত কিছু অফার করুন।");return;}
    act({type:"trade",to,give,want});document.getElementById("tradepop").classList.remove("show");};
  document.getElementById("tradepop").classList.add("show");}

/* auction */
function renderAuction(){const pop=document.getElementById("auctionpop");if(!S.auction||S.phase!=="auction"){pop.classList.remove("show");return;}
  const a=S.auction,box=document.getElementById("auctionBox");const meActive=YOU>=0&&S.players[YOU]&&!S.players[YOU].bankrupt&&!a.passed.includes(YOU);
  const highName=a.highBy>=0?S.players[a.highBy].name:"—",base=BOARD[a.pos].price,minBid=a.high+10;
  let h=`<h3>🔨 নিলাম</h3><div class="aucprop">${BOARD[a.pos].n}</div><div style="color:#889;font-size:12px">ভিত্তি মূল্য ৳${toBn(base)}</div><div class="auchigh">সর্বোচ্চ বিড: <b>${a.high?taka(a.high):"নেই"}</b>${a.highBy>=0?` — ${highName}`:""}</div>`;
  if(meActive){const def=Math.min(S.players[YOU].money,Math.max(minBid,Math.floor(base/2)));h+=`<div class="aucrow"><input id="bidAmt" type="number" min="${minBid}" value="${def}"><button class="gbtn" id="bidBtn">বিড</button></div><button class="gbtn sec" id="passBtn" style="margin-top:8px;width:100%">পাস</button>`;}
  else h+=`<div style="margin-top:12px;color:#889">${a.passed.includes(YOU)?"আপনি পাস করেছেন — অপেক্ষা করুন।":"অপেক্ষা করছি…"}</div>`;
  box.innerHTML=h;pop.classList.add("show");
  if(meActive){document.getElementById("bidBtn").onclick=()=>act({type:"bid",amount:+document.getElementById("bidAmt").value});document.getElementById("passBtn").onclick=()=>act({type:"pass"});}}
/* votekick */
function openVote(){const box=document.getElementById("voteList");box.innerHTML="";const others=S.players.map((p,i)=>({p,i})).filter(x=>x.i!==YOU&&!x.p.bankrupt);
  if(!others.length){box.innerHTML='<div class="empty">কেউ নেই।</div>';}
  const eligible=S.players.filter((x,i)=>!x.bankrupt&&!x.isBot).length-1;const need=Math.floor(Math.max(1,eligible)/2)+1;
  others.forEach(x=>{const votes=(S.votes&&S.votes[x.i])||0;const row=document.createElement("div");row.className="vk";
    row.innerHTML=`<span class="vn">${x.p.name}</span><span class="vc">${toBn(votes)}/${toBn(need)}</span><button>ভোট</button>`;
    row.querySelector("button").onclick=()=>act({type:"votekick",target:x.i});box.appendChild(row);});
  document.getElementById("votepop").classList.add("show");}
</script>
</body>
</html>
