<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলাদেশ মনোপলি</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
  :root{
    --felt:#e7f0e3; --ink:#16213e; --gold:#f4c542; --panel:#1b1b2f; --panel2:#26264a;
    --shadow:0 8px 26px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',system-ui,sans-serif;}
  html,body{min-height:100%;}
  body{background:radial-gradient(circle at 30% 8%,#2a2a4a,#0f0f1c 72%);color:#eee;min-height:100vh;}

  #lobby{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lcard{background:var(--panel);border:1px solid #33335a;border-radius:18px;box-shadow:var(--shadow);
    width:min(460px,94vw);padding:28px;text-align:center;}
  .flag{font-size:40px;}
  .lcard h1{color:var(--gold);font-size:26px;margin:6px 0 2px;letter-spacing:1px;}
  .lcard .sub{color:#9aa;font-size:13px;margin-bottom:20px;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:#aab;margin-bottom:5px;}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #444;background:#12121f;color:#fff;font-size:15px;}
  input::placeholder{color:#667;}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#111;font-weight:700;
    font-size:15px;cursor:pointer;transition:.15s;margin-top:4px;}
  .btn:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .btn.sec{background:var(--panel2);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .divider{display:flex;align-items:center;gap:10px;color:#556;margin:16px 0;font-size:12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#33335a;}
  .err{color:#ff7b7b;font-size:13px;min-height:18px;margin-top:8px;}
  .row{display:flex;gap:10px;}

  #waiting{display:none;}
  .codebox{background:#12121f;border:2px dashed var(--gold);border-radius:12px;padding:14px;margin-bottom:16px;}
  .codebox .code{font-size:34px;letter-spacing:8px;color:var(--gold);font-weight:700;}
  .codebox small{color:#9aa;}
  .plist{text-align:left;margin:14px 0;display:flex;flex-direction:column;gap:8px;}
  .plist .pl{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:9px;padding:8px 12px;}
  .pdot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;flex:0 0 auto;}
  .tag{margin-left:auto;font-size:11px;color:#ffcc55;background:#000;padding:1px 6px;border-radius:6px;}

  #game{display:none;padding:18px;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
  #board{--cell:min(6.4vw,68px);width:calc(var(--cell)*11);height:calc(var(--cell)*11);
    display:grid;grid-template-columns:repeat(11,var(--cell));grid-template-rows:repeat(11,var(--cell));
    background:var(--felt);border:3px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);position:relative;flex:0 0 auto;}
  .cell{border:1px solid rgba(0,0,0,.32);background:#f7f7ef;font-size:calc(var(--cell)*.145);line-height:1.08;
    padding:2px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#111;}
  .cell .nm{font-weight:600;text-align:center;margin-top:2px;word-break:break-word;}
  .cell .pr{text-align:center;margin-top:auto;font-weight:700;font-size:calc(var(--cell)*.135);}
  .cell .bar{height:calc(var(--cell)*.22);width:100%;border-bottom:1px solid rgba(0,0,0,.45);}
  .corner{align-items:center;justify-content:center;text-align:center;font-weight:700;background:#eef0e6;font-size:calc(var(--cell)*.15);}
  .cell.own{box-shadow:inset 0 0 0 3px var(--own);}
  .cell.here{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{background:#f7f7ef}50%{background:#fff6cf}}
  #center{grid-column:2/11;grid-row:2/11;background:var(--felt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;}
  #logo{font-size:calc(var(--cell)*.5);font-weight:700;color:#006a4e;text-align:center;line-height:1.1;text-shadow:1px 1px 0 #fff;}
  #logo b{color:#d62828;}
  .midflag{font-size:calc(var(--cell)*.7);}
  .tokens{position:absolute;bottom:1px;right:1px;display:flex;flex-wrap:wrap;gap:1px;max-width:90%;justify-content:flex-end;}
  .tok{width:calc(var(--cell)*.19);height:calc(var(--cell)*.19);border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.5);}
  .houses{position:absolute;top:calc(var(--cell)*.22);left:0;width:100%;display:flex;gap:1px;justify-content:center;}
  .house{width:calc(var(--cell)*.1);height:calc(var(--cell)*.1);background:#2ecc71;border:.5px solid #145a32;}
  .house.hotel{background:#e74c3c;width:calc(var(--cell)*.2);}
  #dice{display:flex;gap:10px;}
  .die{width:calc(var(--cell)*.62);height:calc(var(--cell)*.62);background:#fff;border-radius:9px;display:grid;
    grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;gap:2px;box-shadow:0 4px 10px rgba(0,0,0,.4);}
  .die span{width:calc(var(--cell)*.11);height:calc(var(--cell)*.11);background:#111;border-radius:50%;align-self:center;justify-self:center;}
  .die.roll{animation:shake .45s;}
  @keyframes shake{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-7px) rotate(-14deg)}70%{transform:translateY(4px) rotate(12deg)}}

  #panel{width:340px;display:flex;flex-direction:column;gap:14px;flex:0 0 auto;}
  .card{background:var(--panel);border:1px solid #33335a;border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#889;margin-bottom:9px;}
  .players{display:flex;flex-direction:column;gap:7px;}
  .prow{display:flex;align-items:center;gap:9px;background:var(--panel2);border-radius:9px;padding:7px 10px;transition:.2s;}
  .prow.active{outline:2px solid var(--gold);}
  .prow.bankrupt{opacity:.4;text-decoration:line-through;}
  .prow .nm{font-weight:600;font-size:14px;}
  .prow .money{margin-left:auto;font-weight:700;color:#40d47e;font-size:14px;}
  .prow .badge{font-size:10px;background:#000;color:#ffcc55;padding:1px 5px;border-radius:5px;}
  .prow .off{width:7px;height:7px;border-radius:50%;background:#e74c3c;}
  .prow .on{width:7px;height:7px;border-radius:50%;background:#40d47e;}
  #status{text-align:center;font-size:14px;color:#cdd;min-height:20px;margin:2px 0;}
  #youare{text-align:center;font-size:12px;color:#889;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .gbtn{flex:1 1 auto;min-width:92px;padding:11px;border:none;border-radius:9px;background:var(--gold);color:#111;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;}
  .gbtn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
  .gbtn.sec{background:var(--panel2);color:#fff;}
  .gbtn.danger{background:#c0392b;color:#fff;}
  .gbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  #log{height:190px;overflow-y:auto;font-size:12.5px;line-height:1.55;background:#101020;border-radius:9px;padding:9px;display:flex;flex-direction:column-reverse;}
  #log div{padding:2px 0;border-bottom:1px solid #20203a;}
  .good{color:#40d47e;} .rent{color:#ffa94d;} .bad{color:#ff6b6b;} .info{color:#8ab4f8;} .chat{color:#e0c3fc;}
  .chatbox{display:flex;gap:8px;margin-top:8px;}
  .chatbox input{flex:1;padding:8px;}
  .chatbox button{padding:8px 12px;border:none;border-radius:8px;background:var(--panel2);color:#fff;cursor:pointer;}

  #cardpop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;}
  #cardpop.show{display:flex;}
  .cbox{background:#fff;color:#111;border-radius:16px;padding:26px 22px;width:min(340px,90vw);text-align:center;box-shadow:var(--shadow);border-top:10px solid var(--gold);}
  .cbox h3{font-size:20px;margin-bottom:12px;} .cbox p{font-size:16px;line-height:1.6;}
  #buildpop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;}
  #buildpop.show{display:flex;}
  .bbox{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:20px;width:min(380px,92vw);}
  .bbox h3{color:var(--gold);text-align:center;margin-bottom:12px;}
  .bitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:13px;}
  .bitem .bn{flex:1;}
  .bitem button{border:none;border-radius:7px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:12px;}
  .bitem .add{background:#40d47e;color:#062;} .bitem .rem{background:#ff9d6b;color:#411;}
  #conn{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;z-index:80;display:none;}
</style>
</head>
<body>
<div id="conn"></div>

<div id="lobby">
  <div class="lcard" id="entry">
    <div class="flag">🇧🇩</div>
    <h1>বাংলাদেশ মনোপলি</h1>
    <div class="sub">অনলাইন মাল্টিপ্লেয়ার · সার্ভার লাগে না (পিয়ার-টু-পিয়ার)</div>
    <div class="field"><label>আপনার নাম</label><input id="nameInput" placeholder="যেমনঃ সজল" maxlength="16"></div>
    <button class="btn" id="createBtn">নতুন রুম তৈরি করুন</button>
    <div class="divider">অথবা</div>
    <div class="field"><label>রুম কোড</label>
      <input id="codeInput" placeholder="যেমনঃ ABCDE" maxlength="5" style="text-transform:uppercase;letter-spacing:4px;text-align:center;"></div>
    <button class="btn sec" id="joinBtn">রুমে যোগ দিন</button>
    <div class="err" id="lobbyErr"></div>
  </div>

  <div class="lcard" id="waiting">
    <div class="flag">🇧🇩</div>
    <h1 id="waitTitle">অপেক্ষা করছি…</h1>
    <div class="sub" id="waitSub">বন্ধুদের এই কোড পাঠান</div>
    <div class="codebox"><div class="code" id="roomCode">-----</div><small>এই কোড দিয়ে যে কেউ যোগ দিতে পারবে</small></div>
    <button class="btn sec" id="copyBtn" style="margin-bottom:8px;">🔗 লিংক কপি করুন</button>
    <div class="plist" id="wPlayers"></div>
    <div class="row" id="hostControls" style="display:none;">
      <button class="btn sec" id="addBotBtn">🤖 বট যোগ</button>
      <button class="btn sec" id="rmBotBtn">বট বাদ</button>
    </div>
    <button class="btn" id="startBtn" style="display:none;">খেলা শুরু করুন</button>
    <div class="sub" id="waitNote" style="margin-top:12px;">হোস্ট খেলা শুরু করার অপেক্ষায়…</div>
    <div class="err" id="waitErr"></div>
  </div>
</div>

<div id="game">
  <div id="board"></div>
  <div id="panel">
    <div class="card"><h2>খেলোয়াড়</h2><div class="players" id="players"></div></div>
    <div class="card">
      <div id="youare"></div><div id="status">…</div>
      <div class="btnrow" style="margin-top:10px;">
        <button class="gbtn" id="rollBtn">🎲 ছক্কা ফেলুন</button>
        <button class="gbtn sec" id="buyBtn" disabled>কিনুন</button>
        <button class="gbtn sec" id="endBtn" disabled>পালা শেষ</button>
      </div>
      <div class="btnrow" style="margin-top:8px;">
        <button class="gbtn sec" id="buildBtn" disabled>🏠 নির্মাণ</button>
        <button class="gbtn danger" id="bailBtn" disabled>জামিন ৳৫০</button>
      </div>
    </div>
    <div class="card"><h2>খেলার বিবরণ</h2><div id="log"></div>
      <div class="chatbox"><input id="chatInput" placeholder="বার্তা লিখুন…" maxlength="120"><button id="chatSend">পাঠান</button></div>
    </div>
  </div>
</div>

<div id="cardpop"><div class="cbox"><h3 id="cardTitle"></h3><p id="cardText"></p></div></div>
<div id="buildpop"><div class="bbox"><h3>🏠 বাড়ি / হোটেল নির্মাণ</h3><div id="buildList"></div>
  <button class="btn" id="buildClose" style="margin-top:8px;">বন্ধ করুন</button></div></div>

<script>
/* ============================================================
   বাংলাদেশ মনোপলি — serverless P2P build (GitHub Pages)
   The room creator's browser is the authoritative HOST and runs
   the full game engine; guests connect over WebRTC (PeerJS) and
   exchange intents/state. Same rules as the Node server version.
   ============================================================ */

/* ---------- Bangla numerals ---------- */
const BN=["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
const toBn=n=>String(n).replace(/\d/g,d=>BN[+d]);
const taka=n=>"৳"+toBn(n);

/* ---------- BOARD (all Bangladesh) ---------- */
const C={brown:"#8d5a2b",lblue:"#a9def9",pink:"#e56399",orange:"#ee964b",red:"#d62828",yellow:"#f6bd60",green:"#2a9d3f",blue:"#1d4e89"};

 {n:"শুরু",type:"go"},

const CHANCE=[

 {t:"ঢাকায় এগিয়ে যান।",fx:(r,p)=>moveTo(r,p,39,true)},

 {t:"৩ ঘর পিছিয়ে যান।",fx:(r,p)=>moveTo(r,p,(p.pos+37)%40,false)},

];
const CHEST=[
 {t:"ব্যাংকের ভুলে আপনি ৳২০০ পেলেন।",fx:(r,p)=>credit(r,p,200)},
 {t:"ডাক্তারের ফি ৳৫০ দিন।",fx:(r,p)=>debit(r,p,50)},
 {t:"শেয়ার বিক্রি করে ৳৫০ পেলেন।",fx:(r,p)=>credit(r,p,50)},
 {t:"সরাসরি কারাগারে যান।",fx:(r,p)=>goJail(r,p)},
 {t:"ছুটির তহবিল থেকে ৳১০০ পেলেন।",fx:(r,p)=>credit(r,p,100)},
 {t:"আয়কর ফেরত ৳২০ পেলেন।",fx:(r,p)=>credit(r,p,20)},
 {t:"আজ আপনার জন্মদিন! প্রত্যেকের থেকে ৳১০ পান।",fx:(r,p)=>birthday(r,p)},
 {t:"জীবন বীমা পরিপক্ব হলো। ৳১০০ পেলেন।",fx:(r,p)=>credit(r,p,100)},
 {t:"হাসপাতালের খরচ ৳১০০ দিন।",fx:(r,p)=>debit(r,p,100)},
 {t:"উত্তরাধিকার সূত্রে ৳১০০ পেলেন।",fx:(r,p)=>credit(r,p,100)},
];
const PCOLORS=["#e63946","#457b9d","#2a9d8f","#e9c46a","#9d4edd","#f4845f"];
const BOT_NAMES=["রোবট-১","রোবট-২","রোবট-৩","রোবট-৪","রোবট-৫"];

/* ============================================================
   ENGINE (host only) — ported from the tested Node server
   ============================================================ */
let room=null;               // authoritative state (host)
const idxOf=(r,p)=>r.players.indexOf(p);
const cur=r=>r.players[r.turn];
function logMsg(r,text,cls=""){r.log.push({text,cls}); if(r.log.length>60)r.log.shift();}
function ownsGroup(r,p,g){return BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===g).every(x=>r.ownership[x.i]===idxOf(r,p));}
function countType(r,p,t){let c=0;BOARD.forEach((s,i)=>{if(s.type===t&&r.ownership[i]===idxOf(r,p))c++;});return c;}
function credit(r,p,a){p.money+=a;logMsg(r,`${p.name} ৳${a} পেলেন।`,"good");}
function debit(r,p,a,to){p.money-=a; if(to){to.money+=a;logMsg(r,`${p.name} → ${to.name} ভাড়া ৳${a}।`,"rent");} else logMsg(r,`${p.name} ৳${a} পরিশোধ করলেন।`,"bad"); if(p.money<0)settleDebt(r,p,to);}
function birthday(r,p){let g=0;r.players.forEach(o=>{if(o!==p&&!o.bankrupt){o.money-=10;g+=10;}});p.money+=g;logMsg(r,`${p.name} জন্মদিনে সবার থেকে ৳${g} পেলেন।`,"good");}
function repairs(r,p,ph,pt){let c=0;Object.keys(r.houses).forEach(pos=>{if(r.ownership[pos]===idxOf(r,p)){const n=r.houses[pos];c+=n===5?pt:n*ph;}});if(c>0){logMsg(r,`${p.name} মেরামত খরচ ৳${c}।`,"bad");debit(r,p,c);}}
function settleDebt(r,p,cr){
  const mine=Object.keys(r.houses).filter(pos=>r.ownership[pos]===idxOf(r,p)&&r.houses[pos]>0);
  for(const pos of mine){while(r.houses[pos]>0&&p.money<0){r.houses[pos]--;p.money+=Math.floor(BOARD[pos].house/2);logMsg(r,`${p.name} ${BOARD[pos].n}-এ বাড়ি বিক্রি করলেন।`,"info");}}
  if(p.money<0){
    p.bankrupt=true;logMsg(r,`💀 ${p.name} দেউলিয়া হয়ে গেলেন!`,"bad");
    Object.keys(r.ownership).forEach(pos=>{if(r.ownership[pos]===idxOf(r,p)){if(cr&&!cr.bankrupt)r.ownership[pos]=idxOf(r,cr);else delete r.ownership[pos];r.houses[pos]=0;}});
    p.money=0;checkWin(r);
  }
}
function moveTo(r,p,pos,go){if(go&&pos<p.pos){p.money+=200;logMsg(r,`${p.name} শুরু পার হয়ে ৳২০০ পেলেন।`,"good");}p.pos=pos;landOn(r,p);}
function advance(r,p,s){const np=(p.pos+s)%40;if(np<p.pos){p.money+=200;logMsg(r,`${p.name} শুরু পার হয়ে ৳২০০ পেলেন।`,"good");}p.pos=np;landOn(r,p);}
function goJail(r,p){p.pos=10;p.jail=true;p.jailTurns=0;r.doubles=0;logMsg(r,`🚔 ${p.name} কারাগারে গেলেন।`,"bad");}
function landOn(r,p){
  const sq=BOARD[p.pos],owner=r.ownership[p.pos];r.canBuy=false;
  switch(sq.type){
    case"go":logMsg(r,`${p.name} শুরুতে আছেন।`,"info");break;
    case"free":logMsg(r,`${p.name} ফ্রি পার্কিং-এ বিশ্রাম নিচ্ছেন।`,"info");break;
    case"jail":logMsg(r,`${p.name} কারাগার পরিদর্শনে।`,"info");break;
    case"tax":logMsg(r,`${p.name} ${sq.n} ৳${sq.amount} দিলেন।`,"bad");debit(r,p,sq.amount);break;
    case"gotojail":goJail(r,p);break;
    case"chance":drawCard(r,p,CHANCE,"ভাগ্য");break;
    case"chest":drawCard(r,p,CHEST,"গণ তহবিল");break;
    case"prop":case"rr":case"util":
      if(owner===undefined){if(p.money>=sq.price){r.canBuy=true;logMsg(r,`${p.name} ${sq.n}-এ নামলেন (৳${sq.price})।`,"info");}else logMsg(r,`${p.name} ${sq.n}-এ নামলেন কিন্তু কেনার টাকা নেই।`,"info");}
      else if(owner===idxOf(r,p))logMsg(r,`${p.name} নিজের সম্পত্তি ${sq.n}-এ আছেন।`,"info");
      else payRent(r,p,sq,r.players[owner]);
      break;
  }
}
function payRent(r,p,sq,owner){
  if(owner.jail){logMsg(r,`${owner.name} কারাগারে — ${sq.n}-এ ভাড়া নেই।`,"info");return;}
  let rent=0;
  if(sq.type==="prop"){const h=r.houses[p.pos]||0;rent=sq.rent[h];if(h===0&&ownsGroup(r,owner,sq.group))rent*=2;}
  else if(sq.type==="rr")rent=[0,25,50,100,200][countType(r,owner,"rr")];
  else if(sq.type==="util"){const m=countType(r,owner,"util")===2?10:4;rent=m*(r.dice[0]+r.dice[1]);}
  logMsg(r,`${p.name} ${sq.n}-এ ভাড়া ৳${rent} দিতে হবে।`,"rent");debit(r,p,rent,owner);
}
function drawCard(r,p,deck,name){const c=deck[Math.floor(Math.random()*deck.length)];r.lastCard={deck:name,text:c.t};logMsg(r,`${name}: ${c.t}`,"info");c.fx(r,p);}

function doRoll(r){
  const p=cur(r);if(r.phase!=="awaitRoll"||p.bankrupt)return;
  const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);r.dice=[a,b];
  const sum=a+b,dbl=a===b;logMsg(r,`${p.name} ছক্কা ফেলল: ${a} + ${b} = ${sum}${dbl?" (ডাবল!)":""}।`,"info");
  if(p.jail){
    if(dbl){logMsg(r,`${p.name} ডাবল ফেলে কারাগার থেকে মুক্ত!`,"info");p.jail=false;}
    else{p.jailTurns=(p.jailTurns||0)+1;if(p.jailTurns>=3){logMsg(r,`${p.name} ৩ বার পর ৳৫০ দিয়ে মুক্ত হলেন।`,"info");p.money-=50;p.jail=false;}else{logMsg(r,`${p.name} কারাগারে রয়ে গেলেন।`,"info");r.phase="awaitEnd";return;}}
  }
  r.doubles=dbl?r.doubles+1:0;
  if(r.doubles===3){logMsg(r,`${p.name} পরপর ৩ ডাবল — কারাগারে!`,"bad");goJail(r,p);r.phase="awaitEnd";return;}
  advance(r,p,sum);r.phase="awaitEnd";
}
function doBuy(r){const p=cur(r);if(r.phase!=="awaitEnd"||!r.canBuy)return;const sq=BOARD[p.pos];if(r.ownership[p.pos]!==undefined||p.money<sq.price)return;p.money-=sq.price;r.ownership[p.pos]=idxOf(r,p);r.canBuy=false;logMsg(r,`🏠 ${p.name} ${sq.n} কিনলেন (৳${sq.price})।`,"good");}
function doBuild(r,pos){const p=cur(r);if(p.bankrupt)return;const sq=BOARD[pos];if(!sq||sq.type!=="prop")return;if(r.ownership[pos]!==idxOf(r,p))return;if(!ownsGroup(r,p,sq.group))return;if((r.houses[pos]||0)>=5)return;if(p.money<sq.house)return;p.money-=sq.house;r.houses[pos]=(r.houses[pos]||0)+1;const lvl=r.houses[pos]===5?"হোটেল":`${r.houses[pos]} বাড়ি`;logMsg(r,`${p.name} ${sq.n}-এ নির্মাণ করলেন (${lvl})।`,"good");}
function doSell(r,pos){const p=cur(r);const sq=BOARD[pos];if(!sq||sq.type!=="prop")return;if(r.ownership[pos]!==idxOf(r,p))return;if((r.houses[pos]||0)<=0)return;r.houses[pos]--;p.money+=Math.floor(sq.house/2);logMsg(r,`${p.name} ${sq.n}-এ বাড়ি বিক্রি করলেন।`,"info");}
function doBail(r){const p=cur(r);if(!p.jail||r.phase!=="awaitRoll"||p.money<50)return;p.money-=50;p.jail=false;p.jailTurns=0;logMsg(r,`${p.name} ৳৫০ জামিন দিয়ে মুক্ত হলেন।`,"info");}
function doEnd(r){
  const p=cur(r);if(r.phase!=="awaitEnd")return;r.canBuy=false;r.lastCard=null;
  const dbl=r.dice[0]===r.dice[1];
  if(dbl&&!p.jail&&!p.bankrupt&&r.doubles>0&&r.doubles<3){r.phase="awaitRoll";logMsg(r,`${p.name} ডাবল ফেলায় আবার চাল দেবেন।`,"info");return;}
  r.doubles=0;let g=0;do{r.turn=(r.turn+1)%r.players.length;g++;}while(r.players[r.turn].bankrupt&&g<20);
  r.phase="awaitRoll";logMsg(r,`▶ ${cur(r).name}-এর পালা।`,"info");
}
function checkWin(r){const alive=r.players.filter(p=>!p.bankrupt);if(r.started&&alive.length<=1){r.winner=alive[0]?alive[0].name:"কেউ না";r.phase="over";logMsg(r,`🏆 ${r.winner} জিতেছেন!`,"good");}}

/* ---- bots (host) ---- */
function scheduleBot(r,ms=950){if(r.botTimer)clearTimeout(r.botTimer);r.botTimer=setTimeout(()=>botStep(r),ms);}
function botStep(r){
  r.botTimer=null;if(!r.started||r.phase==="over")return;const p=cur(r);if(!p||!p.isBot||p.bankrupt)return;
  if(r.phase==="awaitRoll"){if(p.jail&&p.money>=80&&Math.random()<0.5)doBail(r);doRoll(r);hostBroadcast();maybeBot(r);}
  else if(r.phase==="awaitEnd"){if(r.canBuy){const sq=BOARD[p.pos];if(p.money>=sq.price+60&&Math.random()<0.85)doBuy(r);}botBuild(r,p);doEnd(r);hostBroadcast();maybeBot(r);}
}
function botBuild(r,p){BOARD.forEach((s,i)=>{if(s.type==="prop"&&r.ownership[i]===idxOf(r,p)&&ownsGroup(r,p,s.group)&&(r.houses[i]||0)<5){if(p.money>s.house+200&&Math.random()<0.55)doBuild(r,i);}});}
function maybeBot(r){if(!r.started||r.phase==="over")return;const p=cur(r);if(p&&p.isBot&&!p.bankrupt)scheduleBot(r);}

/* ---- serialize ---- */
function publicState(r){
  return {type:"state",code:r.code,started:r.started,phase:r.phase,turn:r.turn,dice:r.dice,canBuy:r.canBuy,
    winner:r.winner,lastCard:r.lastCard,log:r.log.slice(-40),
    players:r.players.map(p=>({name:p.name,color:p.color,money:p.money,pos:p.pos,jail:p.jail,bankrupt:p.bankrupt,isBot:p.isBot,connected:p.connected})),
    ownership:r.ownership,houses:r.houses};
}

/* ============================================================
   NETWORK (PeerJS)
   ============================================================ */
const PEER_PREFIX="bnmono-";
const PEER_OPTS={config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}]}};
let clientId=localStorage.getItem("bm_cid");
if(!clientId){clientId="c-"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("bm_cid",clientId);}

const NET={isHost:false,peer:null,conns:[],hostConn:null,code:null,name:"",hostClientId:null};
let S=null,YOU=-1,IS_HOST=false;
let lastCardShown=null,lastDice="";

function nameVal(){return (document.getElementById("nameInput").value||"খেলোয়াড়").trim();}
function setErr(id,m){document.getElementById(id).textContent=m||"";}
function connBanner(t){const el=document.getElementById("conn");if(!t){el.style.display="none";}else{el.style.display="block";el.textContent=t;}}
function randCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}

/* ---------- HOST ---------- */
function hostCreate(){
  NET.isHost=true;IS_HOST=true;NET.name=nameVal();NET.hostClientId=clientId;
  const code=randCode();
  connBanner("সংযোগ তৈরি হচ্ছে…");
  NET.peer=new Peer(PEER_PREFIX+code,PEER_OPTS);
  NET.peer.on("open",()=>{
    NET.code=code;connBanner(null);
    room=newRoom(code);
    room.players.push(mkPlayer(clientId,NET.name,0,false));
    room.hostClient=clientId;
    logMsg(room,`${NET.name} রুম তৈরি করলেন।`,"info");
    YOU=0;showWaiting();hostBroadcast();
  });
  NET.peer.on("connection",conn=>hostOnConn(conn));
  NET.peer.on("error",e=>{
    if(String(e).includes("is taken")){NET.peer.destroy();return hostCreate();} // rare code collision → retry
    setErr("lobbyErr","সংযোগ ত্রুটি: "+e.type);connBanner(null);
  });
}
function hostOnConn(conn){
  NET.conns.push(conn);
  conn.on("data",msg=>hostOnData(conn,msg));
  conn.on("close",()=>{const p=room&&room.players[conn.playerIndex];if(p)p.connected=false;hostBroadcast();});
  conn.on("error",()=>{});
}
function hostOnData(conn,msg){
  if(!room)return;
  if(msg.type==="join"){
    const ex=room.players.findIndex(p=>p.clientId===msg.clientId);
    if(ex>=0){room.players[ex].connected=true;conn.playerIndex=ex;conn.clientId=msg.clientId;conn.send({type:"welcome",you:ex});hostBroadcast();maybeBot(room);return;}
    if(room.started){conn.send({type:"error",message:"খেলা ইতিমধ্যে শুরু হয়েছে।"});return;}
    if(room.players.length>=6){conn.send({type:"error",message:"রুম পূর্ণ (সর্বোচ্চ ৬ জন)।"});return;}
    const idx=room.players.length;
    room.players.push(mkPlayer(msg.clientId,(msg.name||"খেলোয়াড়").slice(0,16),idx,false));
    conn.playerIndex=idx;conn.clientId=msg.clientId;
    logMsg(room,`${room.players[idx].name} রুমে যোগ দিলেন।`,"info");
    conn.send({type:"welcome",you:idx});hostBroadcast();return;
  }
  // gameplay intents (validate ownership by clientId)
  hostHandle(msg.clientId||conn.clientId,msg);
}
function hostHandle(cid,msg){
  if(!room)return;
  const pidx=room.players.findIndex(p=>p.clientId===cid);
  const turnOk=()=>room.started&&room.phase!=="over"&&pidx===room.turn&&!room.players[room.turn].bankrupt;
  switch(msg.type){
    case"start": if(cid===room.hostClient&&!room.started&&room.players.length>=2){room.started=true;room.phase="awaitRoll";room.turn=0;logMsg(room,`🎲 খেলা শুরু! ${cur(room).name}-এর পালা।`,"good");hostBroadcast();maybeBot(room);} break;
    case"addBot": if(cid===room.hostClient&&!room.started&&room.players.length<6){const bi=room.players.filter(p=>p.isBot).length;room.players.push(mkPlayer("bot-"+Math.random().toString(36).slice(2),BOT_NAMES[bi]||("রোবট-"+(bi+1)),room.players.length,true));logMsg(room,`একটি বট যোগ হলো।`,"info");hostBroadcast();} break;
    case"removeBot": if(cid===room.hostClient&&!room.started){for(let i=room.players.length-1;i>=0;i--){if(room.players[i].isBot){room.players.splice(i,1);break;}}room.players.forEach((p,i)=>p.color=PCOLORS[i]);hostBroadcast();} break;
    case"roll": if(turnOk()){doRoll(room);hostBroadcast();maybeBot(room);} break;
    case"buy": if(turnOk()){doBuy(room);hostBroadcast();} break;
    case"build": if(turnOk()){doBuild(room,msg.pos);hostBroadcast();} break;
    case"sell": if(turnOk()){doSell(room,msg.pos);hostBroadcast();} break;
    case"bail": if(turnOk()){doBail(room);hostBroadcast();} break;
    case"end": if(turnOk()){doEnd(room);hostBroadcast();maybeBot(room);} break;
    case"chat": {const nm=room.players[pidx]?.name||"?";logMsg(room,`💬 ${nm}: ${String(msg.text||"").slice(0,120)}`,"chat");hostBroadcast();} break;
  }
}
function hostBroadcast(){
  const base=publicState(room);
  S={...base,you:0};render();
  NET.conns.forEach(c=>{if(c.open)c.send({...base,you:typeof c.playerIndex==="number"?c.playerIndex:-1});});
}
function newRoom(code){return {code,players:[],ownership:{},houses:{},turn:0,dice:[1,1],doubles:0,started:false,winner:null,phase:"lobby",canBuy:false,lastCard:null,log:[],hostClient:null,botTimer:null};}
function mkPlayer(cid,name,i,isBot){return {clientId:cid,name,color:PCOLORS[i],money:1500,pos:0,jail:false,jailTurns:0,bankrupt:false,isBot,connected:true};}

/* ---------- GUEST ---------- */
function guestJoin(code){
  NET.isHost=false;IS_HOST=false;NET.name=nameVal();NET.code=code;
  connBanner("হোস্টের সাথে সংযোগ হচ্ছে…");
  NET.peer=new Peer(PEER_OPTS);
  NET.peer.on("open",()=>{
    const conn=NET.peer.connect(PEER_PREFIX+code,{reliable:true});
    NET.hostConn=conn;
    let opened=false;
    conn.on("open",()=>{opened=true;connBanner(null);conn.send({type:"join",name:NET.name,clientId});showWaiting();});
    conn.on("data",msg=>guestOnData(msg));
    conn.on("close",()=>{connBanner("হোস্টের সাথে সংযোগ বিচ্ছিন্ন — পুনরায় চেষ্টা…");setTimeout(()=>guestJoin(code),1500);});
    conn.on("error",()=>{});
    setTimeout(()=>{if(!opened){setErr("lobbyErr","রুম খুঁজে পাওয়া যায়নি বা হোস্ট অফলাইন।");connBanner(null);try{NET.peer.destroy();}catch(e){}}},9000);
  });
  NET.peer.on("error",e=>{
    if(e.type==="peer-unavailable"){setErr("lobbyErr","এই কোডের কোনো রুম নেই (হোস্ট অনলাইন আছে তো?)।");}
    else setErr("lobbyErr","সংযোগ ত্রুটি: "+e.type);
    connBanner(null);
  });
}
function guestOnData(msg){
  if(msg.type==="welcome"){YOU=msg.you;showWaiting();return;}
  if(msg.type==="error"){setErr(entryVisible()?"lobbyErr":"waitErr",msg.message);return;}
  if(msg.type==="state"){S=msg;if(typeof msg.you==="number")YOU=msg.you;render();}
}

/* ---------- unified action from UI ---------- */
function act(msg){
  if(NET.isHost)hostHandle(clientId,{...msg,clientId});
  else if(NET.hostConn&&NET.hostConn.open)NET.hostConn.send({...msg,clientId});
}

   UI

const qsRoom=new URLSearchParams(location.search).get("room");
if(qsRoom)document.getElementById("codeInput").value=qsRoom.toUpperCase();

document.getElementById("createBtn").onclick=()=>{if(!nameVal())return setErr("lobbyErr","নাম লিখুন।");setErr("lobbyErr","");hostCreate();};
document.getElementById("joinBtn").onclick=()=>{const code=document.getElementById("codeInput").value.trim().toUpperCase();if(!nameVal())return setErr("lobbyErr","নাম লিখুন।");if(code.length!==5)return setErr("lobbyErr","৫ অক্ষরের রুম কোড দিন।");setErr("lobbyErr","");guestJoin(code);};
document.getElementById("startBtn").onclick=()=>act({type:"start"});
document.getElementById("addBotBtn").onclick=()=>act({type:"addBot"});
document.getElementById("rmBotBtn").onclick=()=>act({type:"removeBot"});
document.getElementById("copyBtn").onclick=()=>{const url=`${location.origin}${location.pathname}?room=${NET.code}`;navigator.clipboard?.writeText(url);const b=document.getElementById("copyBtn");b.textContent="✓ কপি হয়েছে!";setTimeout(()=>b.textContent="🔗 লিংক কপি করুন",1500);};
document.getElementById("rollBtn").onclick=()=>act({type:"roll"});
document.getElementById("buyBtn").onclick=()=>act({type:"buy"});
document.getElementById("endBtn").onclick=()=>act({type:"end"});
document.getElementById("bailBtn").onclick=()=>act({type:"bail"});
document.getElementById("buildBtn").onclick=()=>openBuild();
document.getElementById("buildClose").onclick=()=>document.getElementById("buildpop").classList.remove("show");
document.getElementById("chatSend").onclick=sendChat;
document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
function sendChat(){const el=document.getElementById("chatInput");if(el.value.trim()){act({type:"chat",text:el.value.trim()});el.value="";}}

function entryVisible(){return document.getElementById("waiting").style.display!=="block";}
function showWaiting(){document.getElementById("entry").style.display="none";document.getElementById("waiting").style.display="block";document.getElementById("roomCode").textContent=NET.code;}
function showGame(){document.getElementById("lobby").style.display="none";document.getElementById("game").style.display="flex";buildBoardDOM();}

function render(){if(!S)return;if(S.started||S.phase==="over"){if(document.getElementById("game").style.display!=="flex")showGame();renderGame();}else renderWaiting();}

function renderWaiting(){
  const box=document.getElementById("wPlayers");box.innerHTML="";
  S.players.forEach(p=>{const d=document.createElement("div");d.className="pl";d.innerHTML=`<div class="pdot" style="background:${p.color}"></div><div>${p.name}</div>`+(p.isBot?`<span class="tag">বট</span>`:"");box.appendChild(d);});
  document.getElementById("hostControls").style.display=IS_HOST?"flex":"none";
  document.getElementById("startBtn").style.display=IS_HOST?"block":"none";
  document.getElementById("startBtn").disabled=S.players.length<2;
  document.getElementById("waitNote").style.display=IS_HOST?"none":"block";
}

const cellEls=[];
function gridPos(i){if(i<=10)return{r:11,c:11-i};if(i<=20)return{r:11-(i-10),c:1};if(i<=30)return{r:1,c:1+(i-20)};return{r:1+(i-30),c:11};}
function buildBoardDOM(){
  const bd=document.getElementById("board");bd.innerHTML="";
  const center=document.createElement("div");center.id="center";
  center.innerHTML=`<div class="midflag">🇧🇩</div><div id="logo">বাংলাদেশ<br><b>মনোপলি</b></div><div id="dice"><div class="die"></div><div class="die"></div></div>`;
  bd.appendChild(center);
  BOARD.forEach((sq,i)=>{const el=document.createElement("div");const gp=gridPos(i);el.style.gridRow=gp.r;el.style.gridColumn=gp.c;el.className="cell"+(i%10===0?" corner":"");el.innerHTML=cellHTML(sq);bd.appendChild(el);cellEls[i]=el;});
  drawDice();
}
function cellHTML(sq){
  if(sq.type==="prop")return `<div class="bar" style="background:${C[sq.group]}"></div><div class="nm">${sq.n}</div><div class="pr">${taka(sq.price)}</div>`;
  if(sq.type==="rr")return `<div class="nm">🚉<br>${sq.n}</div><div class="pr">${taka(200)}</div>`;
  if(sq.type==="util")return `<div class="nm">${sq.n.includes("বিদ্যুৎ")?"💡":"🔥"}<br>${sq.n}</div><div class="pr">${taka(150)}</div>`;
  if(sq.type==="tax")return `<div class="nm">💰<br>${sq.n}</div><div class="pr">${taka(sq.amount)}</div>`;
  if(sq.type==="chance")return `<div class="nm" style="margin-top:20%;font-size:1.6em">❓</div><div class="nm">${sq.n}</div>`;
  if(sq.type==="chest")return `<div class="nm" style="margin-top:20%;font-size:1.6em">📦</div><div class="nm">${sq.n}</div>`;
  if(sq.type==="go")return `<div style="text-align:center">⬅️<br>শুরু<br>${taka(200)}</div>`;
  if(sq.type==="jail")return `<div style="text-align:center">🔒<br>কারাগার</div>`;
  if(sq.type==="free")return `<div style="text-align:center">🅿️<br>ফ্রি<br>পার্কিং</div>`;
  if(sq.type==="gotojail")return `<div style="text-align:center">🚔<br>জেলে<br>যাও</div>`;
  return sq.n;
}
function renderGame(){
  const pl=document.getElementById("players");pl.innerHTML="";
  S.players.forEach((p,i)=>{const d=document.createElement("div");d.className="prow"+(i===S.turn?" active":"")+(p.bankrupt?" bankrupt":"");
    d.innerHTML=`<div class="pdot" style="background:${p.color}"></div><div class="nm">${p.name}${i===YOU?" (আপনি)":""}</div>${p.jail?'<span class="badge">জেল</span>':""}${p.isBot?'<span class="badge">বট</span>':`<span class="${p.connected?"on":"off"}"></span>`}<div class="money">${taka(p.money)}</div>`;pl.appendChild(d);});
  cellEls.forEach((el,i)=>{el.classList.remove("own","here");el.style.removeProperty("--own");const o=S.ownership[i];if(o!==undefined){el.classList.add("own");el.style.setProperty("--own",S.players[o].color);}});
  if(S.players[S.turn])cellEls[S.players[S.turn].pos]?.classList.add("here");
  document.querySelectorAll(".tokens,.houses").forEach(e=>e.remove());
  const byCell={};S.players.forEach(p=>{if(!p.bankrupt)(byCell[p.pos]=byCell[p.pos]||[]).push(p);});
  Object.entries(byCell).forEach(([pos,list])=>{const c=document.createElement("div");c.className="tokens";list.forEach(p=>{const t=document.createElement("div");t.className="tok";t.style.background=p.color;c.appendChild(t);});cellEls[pos].appendChild(c);});
  Object.entries(S.houses).forEach(([pos,n])=>{if(!n)return;const h=document.createElement("div");h.className="houses";if(n===5){const e=document.createElement("div");e.className="house hotel";h.appendChild(e);}else for(let k=0;k<n;k++){const e=document.createElement("div");e.className="house";h.appendChild(e);}cellEls[pos].appendChild(h);});
  const dkey=S.dice.join("-")+"/"+S.turn+"/"+S.phase;if(dkey!==lastDice){drawDice(true);lastDice=dkey;}
  const logEl=document.getElementById("log");logEl.innerHTML="";S.log.slice().reverse().forEach(l=>{const d=document.createElement("div");d.className=l.cls;d.textContent=l.text;logEl.appendChild(d);});
  const me=S.turn===YOU,p=S.players[S.turn];
  document.getElementById("youare").textContent=S.winner?"":(me?"আপনার পালা!":`${p.name}-এর পালা…`);
  if(S.winner){document.getElementById("status").innerHTML=`🏆 <b>${S.winner}</b> জিতেছেন!`;["rollBtn","buyBtn","endBtn","buildBtn","bailBtn"].forEach(id=>document.getElementById(id).disabled=true);}
  else{
    const sq=BOARD[p.pos];let st="";
    if(S.phase==="awaitRoll")st=me?(p.jail?"কারাগারে — ছক্কা ফেলুন বা জামিন দিন।":"ছক্কা ফেলুন।"):"অপেক্ষা করছি…";
    else if(S.phase==="awaitEnd")st=me?(S.canBuy?`${sq.n} কিনবেন ${taka(sq.price)}?`:"পালা শেষ করুন বা নির্মাণ করুন।"):"অপেক্ষা করছি…";
    document.getElementById("status").textContent=st;
    document.getElementById("rollBtn").disabled=!(me&&S.phase==="awaitRoll");
    document.getElementById("buyBtn").disabled=!(me&&S.phase==="awaitEnd"&&S.canBuy);
    document.getElementById("endBtn").disabled=!(me&&S.phase==="awaitEnd");
    document.getElementById("bailBtn").disabled=!(me&&S.phase==="awaitRoll"&&p.jail&&p.money>=50);
    document.getElementById("buildBtn").disabled=!(me&&(S.phase==="awaitEnd"||S.phase==="awaitRoll")&&hasBuildable());
  }
  if(S.lastCard&&JSON.stringify(S.lastCard)!==lastCardShown){lastCardShown=JSON.stringify(S.lastCard);showCard(S.lastCard.deck,S.lastCard.text);}
  if(!S.lastCard)lastCardShown=null;
  if(document.getElementById("buildpop").classList.contains("show"))openBuild();
}
function drawDice(animate){
  const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  document.querySelectorAll("#dice .die").forEach((die,k)=>{const v=(S&&S.dice[k])||1;die.innerHTML="";for(let j=0;j<9;j++){const s=document.createElement("span");if(!P[v].includes(j))s.style.visibility="hidden";die.appendChild(s);}if(animate){die.classList.remove("roll");void die.offsetWidth;die.classList.add("roll");}});
}
function showCard(title,text){document.getElementById("cardTitle").textContent=title;document.getElementById("cardText").textContent=text;const pop=document.getElementById("cardpop");pop.classList.add("show");setTimeout(()=>pop.classList.remove("show"),2600);}
function myFullSets(){const g={};BOARD.forEach((s,i)=>{if(s.type==="prop"&&S.ownership[i]===YOU)(g[s.group]=g[s.group]||[]).push(i);});const cells=[];Object.entries(g).forEach(([grp,arr])=>{const all=BOARD.map((s,i)=>({s,i})).filter(x=>x.s.group===grp);if(all.every(x=>S.ownership[x.i]===YOU))cells.push(...arr);});return cells;}
function hasBuildable(){return myFullSets().length>0;}
function openBuild(){
  const list=document.getElementById("buildList");const cells=myFullSets();list.innerHTML="";
  if(!cells.length)list.innerHTML="<p style='text-align:center;color:#889'>নির্মাণের জন্য একটি সম্পূর্ণ রঙের সেট দরকার।</p>";
  cells.forEach(i=>{const n=S.houses[i]||0;const label=n===5?"হোটেল (সর্বোচ্চ)":toBn(n)+" বাড়ি";const row=document.createElement("div");row.className="bitem";
    row.innerHTML=`<span class="bn">${BOARD[i].n} · ${label}</span><button class="rem" ${n<=0?"disabled style='opacity:.4'":""}>−</button><button class="add" ${n>=5?"disabled style='opacity:.4'":""}>+ ${taka(BOARD[i].house)}</button>`;
    row.querySelector(".add").onclick=()=>act({type:"build",pos:i});row.querySelector(".rem").onclick=()=>act({type:"sell",pos:i});list.appendChild(row);});
  document.getElementById("buildpop").classList.add("show");
}
</script>
</body>
</html>
